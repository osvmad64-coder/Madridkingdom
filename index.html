<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a120b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Madrid Kingdom">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Madrid Kingdom</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;600;700&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#c9a63c;
    --gold-bright:#e6c765;
    --ember:#a8462f;
    --ember-bright:#c96040;
    --emerald:#2f6b52;
    --sky:#3f7f9e;
    --ink:#1c140d;
    --parchment:#e9d9ac;
    --parchment-dim:#cbb888;
    --panel:#2b1f14;
    --panel-2:#352719;
    --line:#5a4529;
    --hp:#a8342a;
    --xp:#3f7f9e;
    --mana:#4f6fc9;
    --label-ink:#140d07;
    --label-fill:#f7ecd0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --panel:#3a2b1c;
      --panel-2:#453322;
      --parchment:#f1e2b8;
    }
  }
  :root[data-theme="dark"]{ --panel:#241a10; --panel-2:#2b1f14; }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100%;
    background:
      radial-gradient(ellipse at 20% 0%, rgba(201,166,60,0.08), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(168,70,47,0.10), transparent 50%),
      var(--ink);
    color:var(--parchment);
    font-family:'Spectral',serif;
    font-size:15px; line-height:1.5;
  }
  .app{ max-width:1220px; margin:0 auto; padding:18px 16px 40px; }
  h1,h2,h3{font-family:'Cinzel',serif; letter-spacing:.02em;}
  header.top{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--line);
  }
  .title-block h1{
    font-family:'Cinzel Decorative', serif; font-size:26px; margin:0; color:var(--gold-bright);
    text-shadow:0 2px 0 rgba(0,0,0,.5);
  }
  .title-block p{margin:2px 0 0; color:var(--parchment-dim); font-size:13px;}
  .turn-badge{
    font-family:'Cinzel',serif; font-size:14px; color:var(--ink);
    background:linear-gradient(180deg,var(--gold-bright),var(--gold));
    padding:8px 16px; border-radius:3px; border:1px solid #4a3a18;
    box-shadow:0 2px 4px rgba(0,0,0,.4); white-space:nowrap;
  }
  .layout{ display:grid; grid-template-columns:1fr 340px; gap:18px; }
  @media (max-width:900px){ .layout{grid-template-columns:1fr;} }

  .card{
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line); border-radius:6px; padding:14px;
  }
  .map-card{padding:8px;}
  #mapSvg{width:100%; height:auto; display:block; border-radius:4px;}
  .terr{cursor:pointer;}

  .menu-tabs{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin:14px 0 16px; }
  .menu-tabs button.tab-active{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#241a0c; }
  .gloria-pill{ display:inline-block; background:var(--panel); border:1px solid var(--gold); color:var(--gold-bright); border-radius:12px; padding:3px 12px; font-family:'Cinzel',serif; font-size:13px; }
  .chapter-card{ display:flex; gap:12px; align-items:center; text-align:left; border:1px solid var(--line); border-radius:6px; padding:10px 12px; margin-bottom:8px; background:var(--panel); cursor:pointer; }
  .chapter-card:hover:not(.locked){ border-color:var(--gold-bright); }
  .chapter-card.locked{ opacity:.45; cursor:not-allowed; }
  .chapter-card.done{ border-color:var(--emerald); }
  .chapter-card .num{ font-family:'Cinzel Decorative',serif; font-size:22px; color:var(--gold-bright); min-width:30px; text-align:center; }
  .chapter-card h3{ margin:0; font-size:14px; color:var(--gold-bright); }
  .chapter-card p{ margin:2px 0 0; font-size:11.5px; color:var(--parchment-dim); }
  .story-text{ text-align:left; font-style:italic; border-left:3px solid var(--gold); padding:4px 0 4px 12px; margin:10px 0 14px; color:var(--parchment); }
  .ach-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; text-align:left; }
  @media (max-width:560px){ .ach-grid{grid-template-columns:1fr;} }
  .ach{ border:1px solid var(--line); border-radius:6px; padding:8px 10px; background:var(--panel); display:flex; gap:10px; align-items:center; }
  .ach.locked{ opacity:.4; filter:grayscale(1); }
  .ach.unlocked{ border-color:var(--gold); }
  .ach .ico{ font-size:24px; }
  .ach b{ font-size:12.5px; color:var(--gold-bright); display:block; }
  .ach span{ font-size:11px; color:var(--parchment-dim); }
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:10px 0; }
  .stat-box{ background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px; }
  .stat-box b{ display:block; font-size:18px; color:var(--gold-bright); font-family:'Cinzel',serif; }
  .stat-box span{ font-size:11px; color:var(--parchment-dim); }
  .continue-box{ border:1px solid var(--emerald); border-radius:6px; padding:10px 12px; margin:10px 0; background:rgba(47,107,82,.12); }
  @keyframes pulseGlow{ 0%{filter:drop-shadow(0 0 3px rgba(230,199,101,.3)) brightness(1);} 50%{filter:drop-shadow(0 0 12px rgba(230,199,101,.9)) brightness(1.3);} 100%{filter:drop-shadow(0 0 3px rgba(230,199,101,.3)) brightness(1);} }
  .daycycle-pill{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:2px 9px; }
  .terr .label{
    font-family:'Cinzel',serif; font-weight:600; font-size:11px;
    fill:var(--label-fill); paint-order:stroke; stroke:var(--label-ink); stroke-width:3.4px; stroke-linejoin:round;
    pointer-events:none; text-anchor:middle;
  }
  .terr .troopline{
    font-family:'Spectral',serif; font-weight:700; font-size:13.5px;
    fill:var(--label-fill); paint-order:stroke; stroke:var(--label-ink); stroke-width:3.6px; stroke-linejoin:round;
    pointer-events:none; text-anchor:middle;
  }
  .alliance-edge{ stroke:var(--gold-bright); stroke-width:3; stroke-dasharray:7 5; opacity:.85; pointer-events:none; animation:allianceMarch 1s linear infinite; }
  @keyframes allianceMarch{ to{ stroke-dashoffset:-24; } }


  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--parchment-dim); padding:8px 6px 2px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .dot{width:10px; height:10px; border-radius:50%; display:inline-block; border:1px solid #0006;}

  .side{display:flex; flex-direction:column; gap:14px;}
  .stat-row{display:flex; justify-content:space-between; font-size:13px; margin:3px 0;}
  .bar-track{background:#0006; border-radius:3px; height:8px; overflow:hidden; margin:3px 0 8px;}
  .bar-fill{height:100%; border-radius:3px;}
  .bar-fill.hp{background:linear-gradient(90deg,#7a231c,var(--hp));}
  .bar-fill.xp{background:linear-gradient(90deg,#2a5a72,var(--xp));}
  .bar-fill.mana{background:linear-gradient(90deg,#2a3a72,var(--mana));}
  .ap-row{display:flex; gap:5px; margin:4px 0 10px;}
  .ap-pip{width:20px; height:20px; border-radius:4px; background:var(--panel); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:11px;}
  .ap-pip.filled{background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#241a0c;}
  .buffs{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;}
  .buff-chip{font-size:11px; background:var(--panel); border:1px solid var(--emerald); color:var(--gold-bright); padding:3px 7px; border-radius:10px;}

  .btnrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;}
  button{
    font-family:'Cinzel',serif; font-size:12.5px; letter-spacing:.01em;
    background:linear-gradient(180deg,#4a3820,#372a17);
    color:var(--parchment); border:1px solid var(--line);
    padding:8px 12px; border-radius:4px; cursor:pointer;
  }
  button:hover:not(:disabled){filter:brightness(1.15);}
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.primary{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#241a0c; border-color:#4a3a18; font-weight:600; }
  button.danger{ background:linear-gradient(180deg,var(--ember-bright),var(--ember)); color:#2a0f08; }
  button.ghost{ background:transparent; }
  button.block{width:100%;}

  .log{ max-height:150px; overflow-y:auto; font-size:12.5px; color:var(--parchment-dim); display:flex; flex-direction:column-reverse; gap:4px; padding-right:4px; }
  .log div{border-bottom:1px dashed #4a3a2277; padding-bottom:4px;}

  .overlay{ position:fixed; inset:0; background:rgba(10,7,4,.72); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal{
    background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--gold); border-radius:8px;
    max-width:600px; width:100%; max-height:88vh; overflow-y:auto; padding:20px 22px;
  }
  .modal h2{color:var(--gold-bright); margin-top:0;}
  .class-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0;}
  @media (max-width:560px){ .class-grid{grid-template-columns:1fr;} }
  .class-card{ border:1px solid var(--line); border-radius:6px; padding:12px; cursor:pointer; background:var(--panel); text-align:center; }
  .class-card:hover{border-color:var(--gold-bright);}
  .class-card h3{margin:6px 0 4px; font-size:14px; color:var(--gold-bright);}
  .class-card p{font-size:11.5px; color:var(--parchment-dim); margin:2px 0;}

  .diff-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0 18px;}
  @media (max-width:560px){ .diff-grid{grid-template-columns:1fr;} }
  .diff-card{ border:1px solid var(--line); border-radius:6px; padding:10px; cursor:pointer; background:var(--panel); text-align:center; }
  .diff-card:hover{border-color:var(--gold-bright);}
  .diff-card.chosen{border-color:var(--gold-bright); box-shadow:0 0 0 1px var(--gold-bright) inset;}
  .diff-card h3{margin:4px 0; font-size:13px; color:var(--gold-bright);}
  .diff-card p{font-size:11px; color:var(--parchment-dim); margin:2px 0;}
  .emoji{font-size:30px;}

  .shop-item{ display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--line); border-radius:5px; padding:9px 11px; margin-bottom:8px; }
  .shop-item.equipped{border-color:var(--emerald);}
  .shop-item .info b{color:var(--gold-bright); font-size:13px;}
  .shop-item .info div{font-size:11.5px; color:var(--parchment-dim);}
  .tabbar{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
  .tabbar button.tab-active{ background:linear-gradient(180deg,var(--gold-bright),var(--gold)); color:#241a0c; }
  .tree-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0;}
  @media (max-width:560px){ .tree-grid{grid-template-columns:1fr;} }

  select{ font-family:'Spectral',serif; font-size:13px; background:var(--panel); color:var(--parchment); border:1px solid var(--line); border-radius:4px; padding:6px 8px; width:100%; }
  .hint{font-size:11.5px; color:var(--parchment-dim); margin:6px 0 0;}
  .center-text{text-align:center;}
  .divider{border:none; border-top:1px solid var(--line); margin:12px 0;}
  .deal-box{ border:1px solid var(--gold); border-radius:6px; padding:12px; margin-bottom:14px; background:rgba(201,166,60,.08); }
  .loot-toast{ text-align:center; }
  .loot-toast .emoji{font-size:40px;}

  .toast-stack{ position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:80; display:flex; flex-direction:column; gap:8px; max-width:320px; }
  .toast{
    background:linear-gradient(180deg,var(--panel-2),var(--panel)); border:1px solid var(--line); border-left:4px solid var(--gold-bright);
    border-radius:6px; padding:9px 12px; font-size:12.5px; box-shadow:0 6px 16px rgba(0,0,0,.5); animation:toastIn .25s ease-out;
  }
  .toast.good{ border-left-color:var(--emerald); }
  .toast.bad{ border-left-color:var(--ember-bright); }
  .toast.unlock{ border-left-color:var(--mana); }
  .toast.epic{ border-left-width:6px; font-size:13.5px; font-weight:600; box-shadow:0 8px 22px rgba(0,0,0,.6), 0 0 14px rgba(230,199,101,.35); }
  @keyframes toastIn{ from{opacity:0; transform:translateX(24px);} to{opacity:1; transform:translateX(0);} }

  /* ====== Estética v2: mapa ilustrado ====== */
  .map-card{ padding:10px; background:linear-gradient(180deg,#2c2016,#1a120b) !important; border:1px solid #6b5230; }
  #mapSvg{ border-radius:6px; background:#071a29; box-shadow:0 0 0 1px rgba(0,0,0,.6), 0 8px 22px rgba(0,0,0,.5); touch-action:manipulation; }
  .terr{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .terr .decor, .terr .shade, .terr .relief, .terr .tint, .terr .fog, .terr .fog-veil, .terr .border, .terr .base, .terr .hl, .terr .hovershade{ pointer-events:none; }
  .terr .base{ stroke-linejoin:round; }
  .terr .border{ fill:none; stroke:#1b120a; stroke-width:1.7; stroke-opacity:.82; stroke-linejoin:round; }
  .terr .hovershade{ fill:#fff6d8; opacity:0; transition:opacity .18s ease; }
  .terr:hover .hovershade, .terr.hovered .hovershade{ opacity:.1; }
  .terr .hl{ stroke:#f3d77a; stroke-width:12; opacity:0; stroke-linejoin:round; transition:opacity .2s ease; }
  .terr:hover .hl, .terr.hovered .hl{ opacity:.38; }
  .terr.selected .hl{ opacity:.95; stroke-width:14; animation:hlPulse 1.8s ease-in-out infinite; }
  .terr.attackable .hl{ stroke:#ff9d6e; stroke-width:9; opacity:.6; stroke-dasharray:12 10; animation:hlMarch 2.4s linear infinite; }
  .terr.attackable:hover .hl, .terr.attackable.hovered .hl{ opacity:1; }
  @keyframes hlPulse{ 0%,100%{opacity:.95} 50%{opacity:.55} }
  @keyframes hlMarch{ to{ stroke-dashoffset:-46; } }
  .terr .fog{ animation:fogBreath 6s ease-in-out infinite; }
  @keyframes fogBreath{ 0%,100%{opacity:.8} 50%{opacity:1} }
  .road-bed{ fill:none; stroke:#3a2a16; stroke-width:3.4; stroke-linecap:round; opacity:.22; }
  .route{ fill:none; stroke:#ecdcae; stroke-width:1.3; stroke-dasharray:4 5; stroke-linecap:round; opacity:.45; }
  .terr-top{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .terr-top .city, .terr-top .medal, .terr-top .ribbon{ transform-box:fill-box; transform-origin:center; transition:transform .18s ease; }
  .terr-top:hover .medal, .terr-top.hovered .medal{ transform:scale(1.08); }
  .terr-top:hover .ribbon, .terr-top.hovered .ribbon{ transform:translateY(-1.5px); }
  .terr-top.selected .city{ transform:translateY(-2px); }
  .terr-top .sel-ring{ fill:none; stroke:#f3d77a; stroke-width:2.2; opacity:0; }
  .terr-top.selected .sel-ring{ opacity:1; animation:hlPulse 1.8s ease-in-out infinite; }
  .terr-top.attackable .sel-ring{ opacity:.8; stroke:#ff9d6e; stroke-dasharray:4 3; }
  .ribbon-text{ font-family:'Cinzel',serif; font-weight:700; font-size:11px; fill:#2a1c10; text-anchor:middle; pointer-events:none; letter-spacing:.02em; }
  .terr-top.boss .ribbon-text{ fill:#f3d98a; }
  .troop-num{ font-family:'Spectral',serif; font-weight:700; font-size:12.5px; fill:#fff; text-anchor:middle; paint-order:stroke; stroke:#140d07; stroke-width:2.6px; pointer-events:none; }
  .atk-mark .bob{ transform-box:fill-box; transform-origin:center; animation:bob 1.5s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }

  /* ====== Estética v2: interfaz ====== */
  body{ background:radial-gradient(ellipse at 50% -10%, rgba(201,166,60,.10), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(63,127,158,.08), transparent 55%), #150e08; }
  .card{ background:linear-gradient(180deg,#33261a 0%,#241910 100%); border:1px solid #5e4527; border-radius:8px; box-shadow:inset 0 1px 0 rgba(255,236,190,.06), inset 0 0 0 1px rgba(201,166,60,.1), 0 10px 22px rgba(0,0,0,.42); }
  .card h3{ letter-spacing:.04em; text-shadow:0 1px 0 rgba(0,0,0,.6); }
  header.top{ border-bottom:1px solid transparent; border-image:linear-gradient(90deg, transparent, #c9a63c 20%, #c9a63c 80%, transparent) 1; }
  .title-block h1{ letter-spacing:.03em; text-shadow:0 2px 0 #000, 0 0 18px rgba(230,199,101,.25); }
  .turn-badge{ border-radius:999px; padding:8px 18px; border:1px solid #6b5220; box-shadow:inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.2), 0 3px 8px rgba(0,0,0,.45); }
  button{ background:linear-gradient(180deg,#5a4428 0%,#3d2d19 100%); border:1px solid #715632; border-radius:6px; box-shadow:inset 0 1px 0 rgba(255,230,180,.16), 0 2px 0 rgba(0,0,0,.35); text-shadow:0 1px 0 rgba(0,0,0,.5); transition:transform .12s ease, filter .12s ease, box-shadow .12s ease; }
  button:hover:not(:disabled){ filter:brightness(1.12); transform:translateY(-1px); }
  button:active:not(:disabled){ transform:translateY(1px); box-shadow:inset 0 2px 4px rgba(0,0,0,.4); }
  button:focus-visible{ outline:2px solid var(--gold-bright); outline-offset:2px; }
  button.primary{ background:linear-gradient(180deg,#f0d57e 0%,#c9a63c 55%,#a8862b 100%); color:#2a1c0a; border-color:#6b5220; text-shadow:0 1px 0 rgba(255,245,210,.5); box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 2px 0 rgba(0,0,0,.35); }
  button.danger{ background:linear-gradient(180deg,#d4704c 0%,#a8462f 60%,#8a3522 100%); color:#fff4e6; text-shadow:0 1px 0 rgba(0,0,0,.45); border-color:#6b2a1a; }
  button.ghost{ background:rgba(0,0,0,.18); box-shadow:none; }
  .bar-track{ height:10px; border-radius:6px; background:#120b06; border:1px solid #4a3620; box-shadow:inset 0 1px 3px rgba(0,0,0,.7); }
  .bar-fill{ border-radius:5px; transition:width .45s ease; }
  .bar-fill.hp{ background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%), linear-gradient(90deg,#6e1f18,#c7412f); }
  .bar-fill.mana{ background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%), linear-gradient(90deg,#26357a,#5f82e0); }
  .bar-fill.xp{ background:linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0) 55%), linear-gradient(90deg,#235a6e,#4fa3c4); }
  .ap-pip{ width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #3a2c1b, #1a120b); border:1px solid #5e4527; box-shadow:inset 0 1px 2px rgba(0,0,0,.6); }
  .ap-pip.filled{ background:radial-gradient(circle at 35% 30%, #fff1b8, #e6c765 40%, #a8862b 100%); border-color:#6b5220; box-shadow:0 0 6px rgba(230,199,101,.45), inset 0 -1px 0 rgba(0,0,0,.25); }
  .overlay{ background:radial-gradient(ellipse at center, rgba(20,14,8,.62), rgba(5,3,2,.86)); }
  .modal{ background:linear-gradient(180deg,#34271a,#231810); border:1px solid #c9a63c; border-radius:10px; box-shadow:0 0 0 4px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,230,170,.08), 0 24px 60px rgba(0,0,0,.65); animation:modalIn .22s ease-out; }
  .modal h2{ text-shadow:0 2px 0 #000; letter-spacing:.03em; }
  @keyframes modalIn{ from{ opacity:0; transform:translateY(8px) scale(.98);} to{ opacity:1; transform:none;} }
  .shop-item{ background:rgba(0,0,0,.18); border-color:#5e4527; border-radius:6px; }
  .legend > span{ background:rgba(0,0,0,.25); border:1px solid rgba(201,166,60,.18); border-radius:999px; padding:3px 10px; }
  .dot{ box-shadow:0 0 0 1px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.3); }
  .toast{ background:linear-gradient(180deg,#34271a,#241910); border:1px solid #5e4527; border-left:4px solid var(--gold-bright); border-radius:8px; box-shadow:0 10px 24px rgba(0,0,0,.55); }
  .class-card, .diff-card, .chapter-card{ transition:transform .15s ease, border-color .15s ease; }
  .class-card:hover, .diff-card:hover, .chapter-card:not(.locked):hover{ transform:translateY(-2px); }
  @media (prefers-reduced-motion: reduce){
    .terr .hl, .terr-top .sel-ring, .atk-mark .bob, .terr .fog, .alliance-edge, .modal{ animation:none !important; }
    button, .class-card, .diff-card, .chapter-card, .terr-top .city, .terr-top .medal, .terr-top .ribbon{ transition:none !important; }
  }

  /* ====== Interfaz de juego móvil ====== */
  .main-col{ min-width:0; }

  .hud-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .hud .title-block h1{ font-size:22px; }
  .hud .title-block p{ margin:2px 0 0; }
  .hud .obj-line{ margin:3px 0 0; color:var(--gold-bright); }
  .hud-stats{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto auto 44px; gap:8px; align-items:center; margin-top:10px; }
  .mini{ min-width:0; }
  .mini-lbl{ display:block; font-size:12px; line-height:1.1; margin-bottom:3px; white-space:nowrap; }
  .mini .bar-track{ height:8px; margin:0; }
  .hud-gold{ font-family:'Cinzel',serif; font-weight:700; font-size:14px; color:var(--gold-bright); white-space:nowrap; }
  .hud-ap{ display:flex; align-items:center; gap:3px; }
  .ap-dot{ width:11px; height:11px; border-radius:50%; background:#1a120b; border:1px solid #5e4527; }
  .ap-dot.on{ background:radial-gradient(circle at 35% 30%, #fff1b8, #e6c765 45%, #a8862b); border-color:#6b5220; box-shadow:0 0 5px rgba(230,199,101,.5); }
  .ap-txt{ font-size:11px; color:var(--parchment-dim); margin-left:3px; white-space:nowrap; }
  .hud-profile{ position:relative; width:44px; height:44px; padding:0; font-size:18px; border-radius:50%; }
  .badge-dot{ position:absolute; top:3px; right:3px; width:10px; height:10px; border-radius:50%; background:var(--ember-bright); box-shadow:0 0 0 2px #241910; }

  .ctx-panel{ margin:8px 2px 4px; background:linear-gradient(180deg,#2e2217,#20160e); border:1px solid #6b5230; border-radius:10px; padding:10px 10px 12px; box-shadow:inset 0 0 0 1px rgba(201,166,60,.12); animation:ctxIn .18s ease-out; }
  .ctx-panel.ctx-empty{ padding:10px 12px; text-align:center; color:var(--parchment-dim); font-size:13px; animation:none; }
  @keyframes ctxIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
  .ctx-head{ display:flex; align-items:center; gap:10px; }
  .ctx-title{ flex:1; min-width:0; }
  .ctx-title b{ display:block; font-family:'Cinzel',serif; color:var(--gold-bright); font-size:15px; }
  .ctx-title span{ font-size:12px; color:var(--parchment-dim); }
  .ctx-dot{ display:inline-block; width:12px; height:12px; border-radius:50%; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,.6), inset 0 1px 1px rgba(255,255,255,.3); }
  .ctx-close{ width:40px; height:40px; padding:0; border-radius:50%; font-size:15px; flex:none; }
  .ctx-info{ font-size:12px; color:var(--parchment-dim); margin:6px 0 8px; }
  .ctx-section{ margin-bottom:8px; }
  .ctx-label{ font-size:12px; font-family:'Cinzel',serif; color:var(--parchment); margin-bottom:6px; }
  .ctx-label em{ color:var(--ember-bright); font-style:normal; }
  .chip-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; }
  .chip{ flex:none; min-height:44px; display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:13px; white-space:nowrap; }
  .chip small{ background:rgba(0,0,0,.35); border-radius:999px; padding:1px 7px; font-family:'Spectral',serif; font-weight:700; }
  .ctx-grid, .more-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  .more-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); margin:6px 0 4px; }
  .ctx-grid button, .more-grid button{ min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px 4px; font-size:12.5px; line-height:1.15; }
  .ctx-grid button small, .more-grid button small{ font-family:'Spectral',serif; font-size:11px; opacity:.85; }

  .action-bar{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin-top:10px; }
  .action-bar button{ min-height:58px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 2px; position:relative; }
  .action-bar .ico{ font-size:21px; line-height:1; }
  .action-bar .lbl{ font-size:10.5px; line-height:1.05; text-align:center; }
  .action-bar .has-badge::after{ content:''; position:absolute; top:6px; right:8px; width:9px; height:9px; border-radius:50%; background:var(--ember-bright); box-shadow:0 0 0 2px #2a1f14; }

  @media (min-width:881px){
    .layout{ grid-template-columns:minmax(0,1fr) 300px; }
    .side .card:first-child{ max-height:none; }
  }
  @media (max-width:880px){
    .side{ display:none; }
    .app{ padding:8px 8px calc(92px + env(safe-area-inset-bottom,0px)); }
    .hud .title-block h1{ font-size:16px; }
    .hud .title-block p{ font-size:11px; line-height:1.3; }
    .hud .turn-badge{ padding:6px 12px; font-size:12px; }
    .hud-stats{ grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto 44px; }
    .hud-ap{ grid-column:1 / span 2; order:5; }
    .hud-gold{ order:3; }
    .hud-profile{ order:4; }
    .map-card{ padding:4px !important; }
    .legend{ flex-wrap:nowrap; overflow-x:auto; padding:6px 2px 2px; -webkit-overflow-scrolling:touch; }
    .legend > span{ flex:none; }
    .action-bar{ position:fixed; left:0; right:0; bottom:0; z-index:40; margin:0; gap:4px; padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));
      background:linear-gradient(180deg, rgba(26,18,11,.92), #140d07); border-top:1px solid #6b5230; box-shadow:0 -10px 24px rgba(0,0,0,.55); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
    .action-bar button{ min-height:56px; }
    .overlay{ align-items:flex-end; padding:0; }
    .modal{ max-width:100%; width:100%; border-radius:16px 16px 0 0; max-height:84vh; padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); }
    .modal .shop-item button, .modal .btnrow button{ min-height:44px; }
    .toast-stack{ left:8px; right:8px; max-width:none; }
  }
  @media (max-width:380px){
    .action-bar .lbl{ font-size:9.5px; }
    .ctx-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  }
  @media (prefers-reduced-motion: reduce){ .ctx-panel{ animation:none; } }

  /* ====== Multijugador ====== */
  .big-btn{ min-height:50px; font-size:15px; }
  .mp-form{ display:flex; flex-direction:column; gap:10px; text-align:left; max-width:420px; margin:0 auto; }
  .mp-lbl{ font-family:'Cinzel',serif; font-size:13px; }
  .mp-input{ font-family:'Spectral',serif; font-size:17px; padding:12px 14px; border-radius:8px; border:1px solid #6b5230; background:#1a120b; color:var(--parchment); min-height:48px; }
  .mp-input:focus{ outline:2px solid var(--gold-bright); outline-offset:1px; }
  .mp-code{ text-transform:uppercase; letter-spacing:.35em; text-align:center; font-family:'Cinzel',serif; font-size:22px; }
  .mp-or{ text-align:center; color:var(--parchment-dim); font-size:12px; margin-top:6px; }
  .mp-code-big{ font-family:'Cinzel Decorative',serif; font-size:44px; letter-spacing:.18em; color:var(--gold-bright); text-shadow:0 2px 0 #000, 0 0 18px rgba(230,199,101,.35); margin:6px 0 2px; }
  .mp-plist{ display:flex; flex-direction:column; gap:6px; text-align:left; }
  .mp-prow{ display:flex; align-items:center; gap:8px; background:rgba(0,0,0,.2); border:1px solid #5e4527; border-radius:8px; padding:8px 10px; min-height:48px; }
  .mp-pcls{ margin-left:auto; font-size:12px; color:var(--parchment-dim); }
  .mp-conn{ font-size:12px; }
  .mp-kick{ width:40px; height:40px; padding:0; border-radius:50%; }
  .mp-classes, .mp-seg{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
  .mp-seg{ grid-template-columns:repeat(auto-fit,minmax(56px,1fr)); }
  .mp-classes button{ min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .mp-seg button{ min-height:46px; }
  .mp-turn{ margin:4px 0 0 !important; font-family:'Cinzel',serif; font-size:13px; color:var(--parchment-dim); }
  .mp-turn.mine{ color:#7fd89a; }
  .mp-offline{ background:#5a2a18; border:1px solid var(--ember-bright); color:#ffe8d8; border-radius:8px; padding:8px 12px; margin-bottom:8px; font-size:13px; text-align:center; }
  .mp-players{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; margin-bottom:6px; -webkit-overflow-scrolling:touch; }
  .mp-card{ flex:none; min-width:132px; background:linear-gradient(180deg,#2e2217,#20160e); border:1px solid #5e4527; border-left:4px solid var(--pc); border-radius:8px; padding:7px 9px; }
  .mp-card.current{ border-color:var(--gold-bright); border-left-color:var(--pc); box-shadow:0 0 0 1px var(--gold-bright), 0 0 12px rgba(230,199,101,.25); }
  .mp-card.out{ opacity:.45; }
  .mp-name{ font-family:'Cinzel',serif; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .mp-stats{ display:flex; gap:8px; font-size:12px; margin-top:3px; white-space:nowrap; }
  .mp-state{ font-size:11px; color:var(--parchment-dim); margin-top:2px; }
  .mp-host-actions{ display:flex; gap:4px; margin-top:6px; }
  .mp-host-actions button{ min-height:36px; font-size:11px; padding:4px 8px; }

  /* ====== Mismo teléfono ====== */
  .local-list{ display:flex; flex-direction:column; gap:10px; text-align:left; }
  .local-row{ background:rgba(0,0,0,.2); border:1px solid #5e4527; border-radius:10px; padding:10px; }
  .local-top{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .local-top .mp-input{ flex:1; min-width:0; }
  .pass-screen{ min-height:calc(100vh - 40px); display:flex; align-items:center; justify-content:center; padding:16px 0; }
  .pass-card{ width:100%; max-width:420px; text-align:center; background:linear-gradient(180deg,#34271a,#231810); border:1px solid #c9a63c; border-radius:14px; padding:26px 18px; box-shadow:0 24px 60px rgba(0,0,0,.6); display:flex; flex-direction:column; gap:10px; }

  .pass-name{ font-family:'Cinzel Decorative',serif; font-size:32px; display:flex; align-items:center; justify-content:center; gap:10px; text-shadow:0 2px 0 #000; }
  .pass-card .hint{ margin:0; }

  /* ====== Pasa el teléfono: identidad, XP, minijuegos, Gran Odilio ====== */
  .crest{ display:inline-block; vertical-align:middle; flex:none; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
  .mp-name .crest, .legend .crest{ margin-right:4px; }
  .crest-btn{ position:relative; width:56px; height:60px; padding:2px; flex:none; display:flex; align-items:center; justify-content:center; }
  .crest-btn small{ position:absolute; right:-2px; bottom:-2px; font-size:13px; }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 8px; }
  .swatch{ width:34px; height:34px; min-height:34px; padding:0; border-radius:50%; border:2px solid rgba(0,0,0,.5); box-shadow:inset 0 1px 1px rgba(255,255,255,.3); }
  .swatch.on{ outline:3px solid var(--gold-bright); outline-offset:2px; }
  .swatch:disabled{ opacity:.18; }
  .crest-tools{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; margin-bottom:8px; }
  .crest-tools button{ min-height:40px; font-size:11.5px; padding:4px 2px; }
  .hud-xp{ margin-top:8px; }
  .hud-xp-lbl{ display:flex; justify-content:space-between; font-size:11px; font-family:'Cinzel',serif; color:var(--parchment-dim); margin-bottom:3px; gap:8px; }
  .hud-xp .bar-track{ height:9px; margin:0; }
  .hud-xp.odilio-track .bar-fill.xp{ background:linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 55%), linear-gradient(90deg,#8a6d24,#e6c765,#fff3c4); box-shadow:0 0 8px rgba(230,199,101,.55); }
  .hud-inc{ font-family:'Spectral',serif; font-weight:600; font-size:11px; color:#9ad8a6; display:block; line-height:1; }
  .hud-gold{ cursor:pointer; }
  .odilio-badge{ margin-top:8px; text-align:center; font-family:'Cinzel',serif; font-size:12.5px; color:#fff; padding:6px 10px; border-radius:999px; background:linear-gradient(90deg, transparent, color-mix(in srgb, var(--oc) 45%, transparent), transparent); border:1px solid var(--oc); box-shadow:0 0 14px var(--oc); animation:odBadge 1.8s ease-in-out infinite; }
  @keyframes odBadge{ 0%,100%{ box-shadow:0 0 8px var(--oc);} 50%{ box-shadow:0 0 20px var(--oc);} }
  .mp-xp{ height:5px; background:#120b06; border-radius:3px; margin-top:4px; overflow:hidden; }
  .mp-xp > div{ height:100%; background:linear-gradient(90deg,#8a6d24,#e6c765); }
  .mp-odilio{ font-size:10.5px; margin-top:3px; color:#fff; text-shadow:0 0 6px var(--oc); }
  .mp-card.od-glow{ box-shadow:0 0 0 1px var(--oc), 0 0 14px var(--oc); }
  .mg-cta{ width:100%; min-height:48px; margin:0 0 8px; font-size:14px; background:linear-gradient(180deg,#3d6b4a,#27462f); border-color:#5f9a6d; }
  .mg-cta small{ font-family:'Spectral',serif; opacity:.85; }
  .mg-overlay{ position:fixed; inset:0; z-index:120; display:flex; flex-direction:column; background:radial-gradient(ellipse at 50% 20%, #243a4a, #0b141c 75%); color:#fff; touch-action:none; user-select:none; -webkit-user-select:none;
    padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px)); }
  .mg-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:'Cinzel',serif; }
  .mg-title{ font-size:16px; color:var(--gold-bright); }
  .mg-score{ font-size:30px; font-weight:700; color:#fff3c4; text-shadow:0 0 12px rgba(230,199,101,.6); min-width:40px; text-align:center; }
  .mg-time{ font-size:15px; min-width:52px; text-align:right; }
  .mg-bar{ height:6px; background:rgba(255,255,255,.12); border-radius:3px; margin:8px 0; overflow:hidden; }
  .mg-bar-fill{ height:100%; width:100%; background:linear-gradient(90deg,#e6c765,#ff9d6e); }
  .mg-arena{ position:relative; flex:1; border-radius:14px; border:1px solid rgba(230,199,101,.35); background:rgba(0,0,0,.25); overflow:hidden; touch-action:none; }
  .mg-hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:18px; padding:20px; animation:mgHint .9s ease forwards; pointer-events:none; }
  .mg-hint b{ font-family:'Cinzel Decorative',serif; font-size:34px; color:var(--gold-bright); }
  @keyframes mgHint{ 0%{opacity:0; transform:scale(.9);} 20%{opacity:1; transform:scale(1);} 80%{opacity:1;} 100%{opacity:0;} }
  .mg-target{ position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; background:radial-gradient(circle, rgba(255,255,255,.18), transparent 70%); animation:mgShrink 1.15s linear forwards; cursor:pointer; }
  @keyframes mgShrink{ 0%{ transform:scale(.4);} 15%{ transform:scale(1.05);} 100%{ transform:scale(.55); opacity:.6; } }
  .mg-target.hit, .mg-bullseye.hit{ animation:mgHit .15s ease-out forwards; }
  .mg-target.gone{ opacity:0; transition:opacity .15s; }
  @keyframes mgHit{ to{ transform:scale(1.6); opacity:0; } }
  .mg-drop{ position:absolute; width:56px; height:56px; margin-left:-28px; display:flex; align-items:center; justify-content:center; font-size:38px; cursor:pointer; }
  .mg-drop.bomb{ filter:drop-shadow(0 0 6px rgba(255,80,60,.8)); }
  .mg-drop.gem{ filter:drop-shadow(0 0 8px rgba(120,220,255,.9)); }
  .mg-bullseye{ position:absolute; width:76px; height:76px; margin:-38px 0 0 -38px; border-radius:50%; cursor:pointer;
    background:radial-gradient(circle, #c8322a 0 17%, #f4ecd0 18% 34%, #c8322a 35% 50%, #f4ecd0 51% 67%, #2a1c10 68% 100%); box-shadow:0 4px 10px rgba(0,0,0,.5); }
  .mg-pop{ position:absolute; transform:translate(-50%,-50%); font-family:'Cinzel',serif; font-weight:700; font-size:18px; color:#fff3c4; text-shadow:0 0 8px rgba(230,199,101,.9); pointer-events:none; animation:mgPop .6s ease-out forwards; }
  .mg-pop.neg{ color:#ff8a7a; text-shadow:0 0 8px rgba(255,80,60,.9); }
  @keyframes mgPop{ to{ transform:translate(-50%,-160%); opacity:0; } }
  .mg-shake{ animation:odShake .3s; }
  .mg-result{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:rgba(8,12,16,.78); animation:modalIn .25s ease-out; padding:20px; text-align:center; }

  .mg-res-score{ font-size:20px; }
  .mg-res-reward{ font-family:'Cinzel',serif; font-size:20px; color:#9ad8a6; }
  /* --- El Gran Odilio --- */
  .odilio{ position:fixed; inset:0; z-index:140; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#fff;
    background:radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--oc) 40%, #000) 0%, #07060a 70%); animation:odIn .35s ease-out; padding:20px; }
  .odilio.out{ animation:odOut .38s ease-in forwards; }
  .odilio.shake{ animation:odShake .6s; }
  @keyframes odIn{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes odOut{ to{ opacity:0; transform:scale(1.04); } }
  @keyframes odShake{ 0%,100%{ transform:translate(0,0);} 15%{ transform:translate(-8px,4px);} 30%{ transform:translate(7px,-5px);} 45%{ transform:translate(-6px,-3px);} 60%{ transform:translate(5px,5px);} 80%{ transform:translate(-3px,2px);} }
  #app.od-shake{ animation:odShake .6s; }
  .od-flash{ position:absolute; inset:0; background:#fff; opacity:0; animation:odFlash .6s ease-out .05s; pointer-events:none; }
  @keyframes odFlash{ 0%{opacity:0;} 20%{opacity:.9;} 100%{opacity:0;} }
  .od-beam{ position:absolute; top:-10%; left:50%; width:44vw; max-width:260px; height:120%; transform:translateX(-50%) scaleY(0); transform-origin:top;
    background:linear-gradient(180deg, #fff 0%, color-mix(in srgb, var(--oc) 70%, #fff) 35%, transparent 100%); opacity:.55; filter:blur(6px); animation:odBeam 1s ease-out .2s forwards; pointer-events:none; }
  @keyframes odBeam{ to{ transform:translateX(-50%) scaleY(1); } }
  .od-rays{ position:absolute; top:22%; left:50%; width:160vmax; height:160vmax; margin:-80vmax 0 0 -80vmax; opacity:0; pointer-events:none;
    background:repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--oc) 35%, transparent) 0 6deg, transparent 6deg 18deg); animation:odRays 5s linear 1.4s forwards; }
  @keyframes odRays{ 0%{ opacity:0; transform:rotate(0deg);} 15%{ opacity:.55;} 100%{ opacity:.35; transform:rotate(40deg);} }
  .od-particles span{ position:absolute; bottom:-30px; color:color-mix(in srgb, var(--oc) 60%, #fff); text-shadow:0 0 8px var(--oc); opacity:0; animation:odRise 2.6s ease-out infinite; pointer-events:none; }
  @keyframes odRise{ 0%{ transform:translateY(0) scale(.6); opacity:0;} 15%{ opacity:1;} 100%{ transform:translateY(-105vh) scale(1.2); opacity:0; } }
  .od-god{ position:relative; width:min(46vw,190px); transform:translateY(-120vh); animation:odDescend 1.3s cubic-bezier(.2,.8,.25,1) .55s forwards; filter:drop-shadow(0 0 22px var(--oc)) drop-shadow(0 0 40px #fff6d8); }
  .od-svg{ width:100%; height:auto; display:block; animation:odFloat 2.4s ease-in-out 1.9s infinite; }
  @keyframes odDescend{ to{ transform:translateY(0); } }
  @keyframes odFloat{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
  .od-text{ position:relative; margin-top:6px; opacity:0; transform:scale(.6); animation:odPop .5s cubic-bezier(.2,1.6,.4,1) 1.55s forwards; }
  .od-text h1{ font-family:'Cinzel Decorative',serif; font-size:clamp(26px,8vw,48px); line-height:1.05; margin:6px 0; color:#fff6d8;
    text-shadow:0 0 18px var(--oc), 0 0 36px var(--oc), 0 3px 0 #000; letter-spacing:.02em; }
  .od-kicker{ font-family:'Cinzel',serif; font-size:15px; color:#fff; display:flex; align-items:center; justify-content:center; gap:6px; }
  .od-line{ font-style:italic; opacity:.9; font-size:14px; }
  @keyframes odPop{ to{ opacity:1; transform:scale(1); } }
  .od-power{ position:relative; margin-top:12px; max-width:420px; padding:12px 16px; border-radius:14px; border:1px solid var(--oc);
    background:linear-gradient(180deg, color-mix(in srgb, var(--oc) 30%, #120c08), #120c08); box-shadow:0 0 24px var(--oc); opacity:0; transform:translateY(20px); animation:odReveal .5s ease-out 2.5s forwards; }
  .od-power .od-icon{ font-size:40px; line-height:1; }
  .od-power b{ display:block; font-family:'Cinzel',serif; font-size:21px; color:#fff6d8; margin:4px 0; text-shadow:0 0 10px var(--oc); }

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function organicPathFromPolygon(poly, seed){
  const rng = mulberry32(Math.floor(seed*1e9) || 1);
  const n = poly.length;
  const pts = [];
  for(let i=0;i<n;i++){
    const a = poly[i], b = poly[(i+1)%n];
    const dx=b[0]-a[0], dy=b[1]-a[1];
    const len = Math.hypot(dx,dy);
    const nx = -dy/(len||1), ny = dx/(len||1);
    pts.push(a);
    const wobble = (rng()-0.5) * Math.min(len*0.35, 22);
    pts.push([ (a[0]+b[0])/2 + nx*wobble, (a[1]+b[1])/2 + ny*wobble ]);
  }
  const m = pts.length;
  let d = `M ${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)} `;
  for(let i=0;i<m;i++){
    const p0=pts[(i-1+m)%m], p1=pts[i], p2=pts[(i+1)%m], p3=pts[(i+2)%m];
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d += `C ${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)} `;
  }
  return d + 'Z';
}

function voronoiCells(sites, w, h){
  const rect = [[0,0],[w,0],[w,h],[0,h]];
  function clip(poly, a, b, c){
    const out=[];
    for(let k=0;k<poly.length;k++){
      const cur=poly[k], prev=poly[(k-1+poly.length)%poly.length];
      const curVal = a*cur[0]+b*cur[1]-c;
      const prevVal = a*prev[0]+b*prev[1]-c;
      const curIn = curVal <= 1e-7;
      const prevIn = prevVal <= 1e-7;
      if(curIn){
        if(!prevIn){
          const t = prevVal/(prevVal-curVal);
          out.push([prev[0]+t*(cur[0]-prev[0]), prev[1]+t*(cur[1]-prev[1])]);
        }
        out.push(cur);
      } else if(prevIn){
        const t = prevVal/(prevVal-curVal);
        out.push([prev[0]+t*(cur[0]-prev[0]), prev[1]+t*(cur[1]-prev[1])]);
      }
    }
    return out;
  }
  return sites.map((s,i)=>{
    let poly = rect;
    sites.forEach((o,j)=>{
      if(i===j) return;
      const a = 2*(o.x-s.x), b = 2*(o.y-s.y);
      const c = (o.x*o.x+o.y*o.y) - (s.x*s.x+s.y*s.y);
      poly = clip(poly, a, b, c);
    });
    if(poly.length<3) poly = [[s.x-14,s.y-14],[s.x+14,s.y-14],[s.x+14,s.y+14],[s.x-14,s.y+14]];
    return poly;
  });
}

      const si=nodes[i], sj=nodes[j];
      const onBisector = cells[i].filter(p=> Math.abs(Math.hypot(p[0]-si.x,p[1]-si.y) - Math.hypot(p[0]-sj.x,p[1]-sj.y)) < 0.75);
      let longest = 0;
      for(let a=0;a<onBisector.length;a++) for(let b=a+1;b<onBisector.length;b++){
        longest = Math.max(longest, Math.hypot(onBisector[a][0]-onBisector[b][0], onBisector[a][1]-onBisector[b][1]));
      }
      if(longest > 10) edges.push([i,j]);
    }
  }
  return edges;
}

function buildEdges(nodes){
  const n = nodes.length;
  const edgeSet = new Set();
  const key=(i,j)=> i<j? i+'-'+j : j+'-'+i;
  for(let i=0;i<n;i++){
    const ds=[];
    for(let j=0;j<n;j++){ if(i!==j) ds.push({j,d:dist(nodes[i],nodes[j])}); }
    ds.sort((a,b)=>a.d-b.d);
    edgeSet.add(key(i,ds[0].j));
    edgeSet.add(key(i,ds[1].j));
  }
  const parent = Array.from({length:n},(_,i)=>i);
  function find(x){ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; }
  function union(a,b){ parent[find(a)]=find(b); }
  edgeSet.forEach(k=>{ const [a,b]=k.split('-').map(Number); union(a,b); });
  const allPairs=[];
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++) allPairs.push({i,j,d:dist(nodes[i],nodes[j])});
  allPairs.sort((a,b)=>a.d-b.d);
  for(const p of allPairs){ if(find(p.i)!==find(p.j)){ edgeSet.add(key(p.i,p.j)); union(p.i,p.j); } }
  const targetTotal = Math.round(n*1.35);
  for(const p of allPairs){
    if(edgeSet.size>=targetTotal) break;
    edgeSet.add(key(p.i,p.j));
  }
  return Array.from(edgeSet).map(k=>k.split('-').map(Number));
}

// Biomas y nombres de tierras (compartido por todos los generadores de mapa).
function mapBiomePicker(rnd){
  const usedNames = new Set();
  function nameFor(biome){
    const opts = biome.names.filter(n=>!usedNames.has(n));
    const pick = (opts.length?opts:biome.names)[Math.floor(rnd()*(opts.length?opts.length:biome.names.length))];
    usedNames.add(pick);
    return pick;
  }
  const poolCopy = [...BIOME_POOL].sort(()=>rnd()-0.5);
  let biomeCursor = 0;
  function nextBiome(){ if(biomeCursor>=poolCopy.length){ poolCopy.push(...BIOME_POOL); } return poolCopy[biomeCursor++]; }
  return { nameFor, nextBiome };
}
// Faction identities: player + ancient-world names for AI kingdoms, teams per mode.
function buildMapFactions(modeDef, factionCount, opts, rnd){
  const shuffledNames = [...FACTION_NAMES].sort(()=>rnd()-0.5);
  const factions = [];
  for(let fi=0; fi<factionCount; fi++){
    const isPlayer = fi===0;
    const id = isPlayer ? 'player' : `ai${fi}`;
    const color = isPlayer ? PLAYER_COLOR : AI_COLORS[(fi-1)%AI_COLORS.length];
    let team;
    if(modeDef.teamPlan==='duel') team = isPlayer?'A':'B';
    else if(modeDef.teamPlan==='ffa') team = 'T'+fi;
    else if(modeDef.teamPlan==='2v2') team = (fi===0||fi===1) ? 'A' : 'B';
    let fname = shuffledNames[fi];
    if(isPlayer && opts.playerName) fname = opts.playerName;
    if(!isPlayer && opts.enemyNames && opts.enemyNames[fi-1]) fname = opts.enemyNames[fi-1];
    factions.push({ id, name:fname, color, isPlayer, team });
  }
  return factions;
}

function generateMap(mode, opts){
  opts = opts || {};
  const modeDef = GAME_MODES[mode];
  const factionCount = 1 + modeDef.aiCount;
  const W=960,H=600, cols=4, rows=4, marginX=95, marginY=85;
  const cellW=(W-2*marginX)/cols, cellH=(H-2*marginY)/rows;
  const cells=[]; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) cells.push({c,r});
  const nodes = cells.map(cell=>{
    const jx=(Math.random()-0.5)*cellW*0.5, jy=(Math.random()-0.5)*cellH*0.5;
    return { x:Math.round(marginX+cellW*(cell.c+0.5)+jx), y:Math.round(marginY+cellH*(cell.r+0.5)+jy) };
  });
  const edgesIdx = voronoiAdjacency(nodes, 960, 600);
  const adj = Array.from({length:nodes.length},()=>[]);
  edgesIdx.forEach(([a,b])=>{ adj[a].push(b); adj[b].push(a); });

  function bfsDist(start){
    const d=Array(nodes.length).fill(-1); d[start]=0; const q=[start];
    while(q.length){ const cur=q.shift(); for(const nb of adj[cur]){ if(d[nb]===-1){ d[nb]=d[cur]+1; q.push(nb); } } }
    return d;
  }

  // Player seed = leftmost node. Remaining faction seeds chosen by farthest-point sampling
  // (each new seed maximizes its minimum distance to all seeds already chosen).
  let playerSeed=0;
  nodes.forEach((nd,i)=>{ if(nd.x<nodes[playerSeed].x) playerSeed=i; });
  const seeds=[playerSeed];
  const distCaches=[bfsDist(playerSeed)];
  while(seeds.length<factionCount){
    let best=-1, bestScore=-1;
    for(let i=0;i<nodes.length;i++){
      if(seeds.includes(i)) continue;
      const minD = Math.min(...distCaches.map(d=>d[i]));
      if(minD>bestScore){ bestScore=minD; best=i; }
    }
    seeds.push(best);
    distCaches.push(bfsDist(best));
  }

  // Boss node: the non-seed node farthest (by summed distance) from every faction seed.
  let bossIdx=-1, bossScore=-1;
  for(let i=0;i<nodes.length;i++){
    if(seeds.includes(i)) continue;
    const score = distCaches.reduce((s,d)=>s+d[i],0);
    if(score>bossScore){ bossScore=score; bossIdx=i; }
  }

  // Extra starting territory per faction (small factionCounts get 2 each, larger get 1).
  const startCount = factionCount<=3 ? 2 : 1;
  const claimed = new Set([...seeds, bossIdx]);
  const factionNodeIdx = seeds.map(()=>[]);
  seeds.forEach((seed,fi)=>{
    factionNodeIdx[fi].push(seed);
    let extra = startCount-1;
    const candidates = [...adj[seed]].sort((a,b)=>distCaches[fi][a]-distCaches[fi][b]);
    for(const c of candidates){
      if(extra<=0) break;
      if(claimed.has(c)) continue;
      claimed.add(c); factionNodeIdx[fi].push(c); extra--;
    }
    if(extra>0){
      const rest = nodes.map((_,i)=>i).filter(i=>!claimed.has(i));
      rest.sort((a,b)=>distCaches[fi][a]-distCaches[fi][b]);
      for(const c of rest){
        if(extra<=0) break;
        claimed.add(c); factionNodeIdx[fi].push(c); extra--;
      }
    }
  });

  const { nameFor, nextBiome } = mapBiomePicker(Math.random);
  const factions = buildMapFactions(modeDef, factionCount, opts, Math.random);

  const idxToOwner = {};
  factionNodeIdx.forEach((idxs,fi)=>{ idxs.forEach(i=>{ idxToOwner[i]=factions[fi].id; }); });

  const territories = nodes.map((nd,i)=>{
    const shapeSeed = Math.random();
    if(i===bossIdx){
      return { id:i+1, name:opts.bossName || BOSS_NAMES[Math.floor(Math.random()*BOSS_NAMES.length)], x:nd.x, y:nd.y,
        owner:'neutral', troops:8, tier:4, isBoss:true, biome:BOSS_BIOME, shapeSeed };
    }
    const biome = nextBiome();
    const name = nameFor(biome);
    if(idxToOwner[i]){
      const isPlayerNode = idxToOwner[i]==='player';
      return { id:i+1, name, x:nd.x, y:nd.y, owner:idxToOwner[i], troops:5, tier:isPlayerNode?1:2, isBoss:false, biome, shapeSeed };
    }
    const troops=2+Math.floor(Math.random()*2), tier= Math.random()<0.3?2:1;
    return { id:i+1, name, x:nd.x, y:nd.y, owner:'neutral', troops, tier, isBoss:false, biome, shapeSeed };
  });
  const edges = edgesIdx.map(([a,b])=>[a+1,b+1]);
  return { territories, edges, factions };
}

// ================= MAPAS DE "ASEDIO DE CASTILLOS" =================
// Mapas grandes (≈30–36 territorios) en formato vertical, cómodo en teléfono. Hay 8 diseños con rutas distintas
// (ríos, cordilleras, lagos, islas...). El mapa se genera UNA sola vez dentro de mpStartGame: en el servidor
// (online) o en el propio teléfono (Mismo teléfono), y viaja en el estado de la partida; nadie lo regenera.
const CASTLE_MAP_W = 960, CASTLE_MAP_H = 1200;
// Ataques necesarios (mínimo) desde cualquier tierra inicial rival hasta tu castillo, según cuántos reinos hay.
// Con 2 reinos hacen falta 6 ataques: imposible en el primer turno (máximo 5 PA con Corcel).
function castleSafeDistance(k){ return k<=2 ? 6 : (k===3 ? 5 : 4); }
function cmInside(x, y, pad){
  const cx=CASTLE_MAP_W/2, cy=CASTLE_MAP_H/2, ax=cx-40-pad, ay=cy-40-pad;
  return Math.pow(Math.abs(x-cx)/ax,7) + Math.pow(Math.abs(y-cy)/ay,7) <= 1;
}
function cmPull(p){ // mete el punto dentro de la costa sin tocar el borde del mapa
  const cx=CASTLE_MAP_W/2, cy=CASTLE_MAP_H/2; let [x,y]=p;
  for(let i=0;i<40 && !cmInside(x,y,78);i++){ x=cx+(x-cx)*0.97; y=cy+(y-cy)*0.97; }
  return [x,y];
}
// Con más reinos, el mapa gana una fila de territorios (≈40) para que los castillos sigan separados.
function cmRows(k){ return k<=2 ? 7 : (k<=4 ? 8 : 9); }
function cmExtra(k){ return k<=2 ? 0 : (k<=4 ? 6 : 11); }
function cmHex(rng, cols, rows){
  const x0=150, x1=CASTLE_MAP_W-150, y0=140, y1=CASTLE_MAP_H-130;
  const dx=(x1-x0)/(cols-0.5), dy=(y1-y0)/(rows-1), pts=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    pts.push(cmPull([x0+c*dx+(r%2)*dx*0.5+(rng()-0.5)*dx*0.32, y0+r*dy+(rng()-0.5)*dy*0.32]));
  }
  return pts;
}
function cmScatter(rng, n, minD, ok){ // puntos al azar bien separados (distribución orgánica)
  const pts=[];
  for(let k=0;k<6000 && pts.length<n;k++){
    const p=[100+rng()*(CASTLE_MAP_W-200), 100+rng()*(CASTLE_MAP_H-200)];
    if(!cmInside(p[0],p[1],78) || (ok && !ok(p))) continue;
    if(pts.some(q=>Math.hypot(q[0]-p[0],q[1]-p[1])<minD)) continue;
    pts.push(p);
  }
  return pts;
}
function cmSegCross(p1,p2,p3,p4){
  const d=(a,b,c)=>(c[0]-a[0])*(b[1]-a[1])-(c[1]-a[1])*(b[0]-a[0]);
  const d1=d(p3,p4,p1), d2=d(p3,p4,p2), d3=d(p1,p2,p3), d4=d(p1,p2,p4);
  return ((d1>0&&d2<0)||(d1<0&&d2>0)) && ((d3>0&&d4<0)||(d3<0&&d4>0));
}
const CX = CASTLE_MAP_W/2, CY = CASTLE_MAP_H/2;
// Cada diseño: cómo se reparten los territorios y qué fronteras son infranqueables.

    passes(){ const c=this._c, mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
      return [mid(c[0],c[1]),mid(c[1],c[2]),mid(c[2],c[3]),mid(c[3],c[4]),mid(c[0],c[2]),mid(c[2],c[4])]; } },
  { key:'salvaje', name:'Tierras Salvajes', icon:'🌲', wall:'ridge', desc:'Terreno irregular con crestas sueltas y atajos inesperados.',
    points:(rng,k)=>cmScatter(rng, 33+cmExtra(k), 115-cmExtra(k)),
    setup(rng){ this._r=Array.from({length:4},()=>{ const x=160+rng()*(CASTLE_MAP_W-320), y=200+rng()*(CASTLE_MAP_H-400), a=rng()*Math.PI, L=150+rng()*120;
      return [[x-Math.cos(a)*L,y-Math.sin(a)*L],[x+Math.cos(a)*L,y+Math.sin(a)*L]]; }); },

function cmSeed(){
  try{ const c=(typeof crypto!=='undefined' && crypto.getRandomValues) ? crypto : null; if(c){ const a=new Uint32Array(1); c.getRandomValues(a); return a[0]||1; } }catch(e){}
  return Math.floor(Math.random()*4294967295)||1;
}
function cmAllDist(n, adj){
  return Array.from({length:n},(_,s)=>{ const d=Array(n).fill(-1); d[s]=0; const q=[s];
    while(q.length){ const c=q.shift(); for(const nb of adj[c]) if(d[nb]<0){ d[nb]=d[c]+1; q.push(nb); } } return d; });
}
// Castillos que siguen conectados entre sí aunque caiga cualquier territorio intermedio (≥2 rutas).
function cmTwoRoutes(n, adj, castles){
  for(let v=0; v<n; v++){
    if(castles.includes(v)) continue;
    const seen=new Set([v, castles[0]]), q=[castles[0]];
    while(q.length){ const c=q.shift(); for(const nb of adj[c]) if(!seen.has(nb)){ seen.add(nb); q.push(nb); } }
    if(castles.some(c=>!seen.has(c))) return false;
  }
  return true;
}
// Elige castillos y tierras iniciales justos. Devuelve null si este mapa no permite un reparto justo.
function cmPlaceCastles(n, adj, D, k, rng){
  const safe = castleSafeDistance(k), minCastle = safe;
  const cand = [...Array(n).keys()].filter(i=>adj[i].length>=3);
  const zoneOf = cs=>{ const z=cs.map(()=>0); for(let v=0;v<n;v++){ const ds=cs.map(c=>D[c][v]), m=Math.min(...ds), w=cs.filter((_,i)=>ds[i]===m); w.forEach(c=>{ z[cs.indexOf(c)]+=1/w.length; }); } return z; };
  const room = c=>D[c].filter(d=>d>=1 && d<=2).length;
  const fair = cs=>{
    for(let i=0;i<cs.length;i++) for(let j=i+1;j<cs.length;j++) if(D[cs[i]][cs[j]]<minCastle) return false;
    const near = cs.map(c=>Math.min(...cs.filter(o=>o!==c).map(o=>D[c][o])));
    if(Math.max(...near)-Math.min(...near) > (k===2?0:1)) return false;
    const z = zoneOf(cs); if(Math.max(...z) > Math.min(...z)*(k===2?1.3:1.5)) return false;
    const r = cs.map(room); if(Math.max(...r)-Math.min(...r) > 2) return false;
    return cmTwoRoutes(n, adj, cs);
  };
  const valid=[];
  if(k===2){ for(let a=0;a<cand.length;a++) for(let b=a+1;b<cand.length;b++){ const cs=[cand[a],cand[b]]; if(fair(cs)) valid.push(cs); } }
  else for(let t=0;t<3000 && valid.length<80;t++){
    // Cada castillo nuevo se elige al azar entre los lugares que ya quedan lejos de los anteriores.
    const cs=[cand[Math.floor(rng()*cand.length)]];
    while(cs.length<k){ const pool=cand.filter(v=>cs.every(c=>D[c][v]>=minCastle)); if(!pool.length) break; cs.push(pool[Math.floor(rng()*pool.length)]); }
    if(cs.length===k && fair(cs)) valid.push(cs);
  }
  if(!valid.length) return null;
  const extra = k<=3 ? 1 : 0; // misma regla que los mapas actuales: 2 tierras iniciales con ≤3 reinos, 1 con más
  for(let tries=0; tries<12; tries++){
    const cs = valid[Math.floor(rng()*valid.length)].slice().sort(()=>rng()-0.5);
    if(!extra) return { castles:cs, starts:cs.map(c=>[c]), safe };
    // Tierra inicial extra: la vecina que queda más lejos de los rivales, igualando la distancia de todos.
    const opts = cs.map(c=>adj[c].filter(v=>!cs.includes(v)));
    let best=null, bestKey=null;
    const walk=(i, pick)=>{
      if(i===cs.length){
        if(new Set(pick).size<pick.length) return;
        const owned = cs.map((c,j)=>[c,pick[j]]);
        const reach = cs.map((c,j)=>Math.min(...owned.filter((_,o)=>o!==j).flat().map(v=>D[v][c]))); // ataques que necesita el rival para tocar este castillo
        if(Math.min(...reach) < safe) return;
        const key=[Math.max(...reach)-Math.min(...reach), rng()];
        if(!bestKey || key[0]<bestKey[0] || (key[0]===bestKey[0] && key[1]<bestKey[1])){ bestKey=key; best=pick.slice(); }
        return;
      }
      for(const v of opts[i]){ pick.push(v); walk(i+1, pick); pick.pop(); }
    };
    walk(0, []);
    if(best && bestKey[0] <= (k===2?0:1)) return { castles:cs, starts:cs.map((c,j)=>[c,best[j]]), safe };
  }
  return null;
}
function generateCastleMap(mode, opts){
  opts = opts || {};
  const modeDef = GAME_MODES[mode];
  const k = 1 + modeDef.aiCount, humans = opts.humanCount || 1;
  const seed = (opts.seed>>>0) || cmSeed();
  const rng = mulberry32(seed);
  const order = CASTLE_MAPS.map((_,i)=>i).sort(()=>rng()-0.5);
  if(opts.mapKey){ const i=CASTLE_MAPS.findIndex(m=>m.key===opts.mapKey); if(i>=0){ order.splice(order.indexOf(i),1); order.unshift(i); } }
  for(let attempt=0; attempt<order.length*6; attempt++){
    const tpl = Object.create(CASTLE_MAPS[order[Math.floor(attempt/6)]]);
    if(tpl.setup) tpl.setup(rng);
    const pts = tpl.points(rng, k);
    if(pts.length<26) continue;
    const nodes = pts.map(([x,y])=>({x:Math.round(x), y:Math.round(y)}));
    if(nodes.some((a,i)=>nodes.some((b,j)=>j>i && Math.hypot(a.x-b.x,a.y-b.y)<90))) continue;
    const vor = voronoiAdjacency(nodes, CASTLE_MAP_W, CASTLE_MAP_H);
    const P = i=>[nodes[i].x, nodes[i].y];
    let blocked = vor.filter(([a,b])=> (tpl.region && tpl.region(P(a))!==tpl.region(P(b))) || (tpl.block && tpl.block(P(a),P(b))));
    (tpl.passes ? tpl.passes() : []).forEach(an=>{
      let bi=-1, bd=1e9;
      blocked.forEach(([a,b],i)=>{ const d=Math.hypot((nodes[a].x+nodes[b].x)/2-an[0], (nodes[a].y+nodes[b].y)/2-an[1]); if(d<bd){ bd=d; bi=i; } });
      if(bi>=0) blocked.splice(bi,1);
    });
    const bset = new Set(blocked.map(([a,b])=>a+'-'+b));
    const edgesIdx = vor.filter(([a,b])=>!bset.has(a+'-'+b));
    const n = nodes.length, adj = Array.from({length:n},()=>[]);
    edgesIdx.forEach(([a,b])=>{ adj[a].push(b); adj[b].push(a); });
    const D = cmAllDist(n, adj);
    if(D[0].some(d=>d<0)) continue; // el mapa debe estar conectado
    const place = cmPlaceCastles(n, adj, D, k, rng);
    if(!place) continue;
    const { nameFor, nextBiome } = mapBiomePicker(rng);
    const factions = buildMapFactions(modeDef, k, opts, rng);
    const ownerOf = {}, castleOf = {};
    place.starts.forEach((idxs,fi)=>{ idxs.forEach(i=>{ ownerOf[i]=factions[fi].id; }); castleOf[place.castles[fi]]=factions[fi].id; });
    const territories = nodes.map((nd,i)=>{
      const biome = nextBiome(), name = nameFor(biome), shapeSeed = rng();
      if(ownerOf[i]){
        const fi = factions.findIndex(f=>f.id===ownerOf[i]);
        const t = { id:i+1, name, x:nd.x, y:nd.y, owner:ownerOf[i], troops:5, tier: fi<humans ? 1 : 2, isBoss:false, biome, shapeSeed };
        if(castleOf[i]) t.castle = castleOf[i];
        return t;
      }
      return { id:i+1, name, x:nd.x, y:nd.y, owner:'neutral', troops:2+Math.floor(rng()*2), tier: rng()<0.3?2:1, isBoss:false, biome, shapeSeed };
    });
    const src = CASTLE_MAPS[order[Math.floor(attempt/6)]];
    return { territories, edges:edgesIdx.map(([a,b])=>[a+1,b+1]), walls:blocked.map(([a,b])=>[a+1,b+1]), factions,
      w:CASTLE_MAP_W, h:CASTLE_MAP_H, info:Object.assign({ key:src.key, name:src.name, icon:src.icon, desc:src.desc, wall:src.wall, seed, safe:place.safe }, tpl.extra ? tpl.extra() : {}) };
  }
  return null; // sin mapa justo: se usa el mapa clásico
}

function applyTreeNodeEffect(branch, idx){
  const p = S.player;
  if(branch==='ofensiva'){
    if(idx===0) p.bonusAtkFlat = (p.bonusAtkFlat||0)+2;
    if(idx===1) p.failDmgReduction = (p.failDmgReduction||0)+1;
    if(idx===2) p.bonusApFlat = (p.bonusApFlat||0)+1;
  }
  if(branch==='economica'){
    if(idx===0) p.bonusGoldPerTurn = (p.bonusGoldPerTurn||0)+2;
    if(idx===1) p.bonusTradeRate = (p.bonusTradeRate||0)+1;
    if(idx===2) p.treeGoldMult = 1.15;
  }
  if(branch==='magica'){
    if(idx===0){ p.maxMana+=3; p.mana=Math.min(p.maxMana,p.mana+3); }
    if(idx===1) p.manaRegenBonus = (p.manaRegenBonus||0)+1;
    if(idx===2) p.manaCostReduction = (p.manaCostReduction||0)+1;
  }
}

  if(mpIntercept('unlockTreeNode', arguments)) return;
  const lvl = S.player.tree[branch];
  if(lvl>=3 || S.player.skillPoints<=0) return;
  S.player.skillPoints--;
  applyTreeNodeEffect(branch, lvl);
  S.player.tree[branch] = lvl+1;
  addLog(`🌳 Desbloqueas: ${SKILL_TREE[branch][lvl].name}.`);
  notify('🌳', `Desbloqueas: ${SKILL_TREE[branch][lvl].name} — ${SKILL_TREE[branch][lvl].desc}`, 'unlock');

}

function tensionMultiplier(){ return 1 + (S.turn/S.maxTurns)*0.9; }

function hasActiveTruce(a,b){
  if(!S.aiTruces) return false;
  return S.aiTruces.some(tr=> tr.turnsLeft>0 && ((tr.a===a&&tr.b===b)||(tr.a===b&&tr.b===a)));
}
function addGrudge(victimId, attackerId, amount){
  if(!S.grudges[victimId]) S.grudges[victimId]={};
  S.grudges[victimId][attackerId] = (S.grudges[victimId][attackerId]||0)+amount;
}
function decayGrudgesAndTruces(){
  Object.keys(S.grudges).forEach(v=>{
    Object.keys(S.grudges[v]).forEach(k=>{
      S.grudges[v][k] = Math.max(0, S.grudges[v][k]-1);
      if(S.grudges[v][k]<=0) delete S.grudges[v][k];
    });
  });
  S.aiTruces.forEach(tr=>{ tr.turnsLeft--; });
  S.aiTruces = S.aiTruces.filter(tr=>tr.turnsLeft>0);
}
function rollAiDiplomacy(){
  if(S.factions.length<=2) return;
  const ais = aiFactions();
  const pairs=[];
  for(let i=0;i<ais.length;i++) for(let j=i+1;j<ais.length;j++){
    const a=ais[i], b=ais[j];
    if(a.team===b.team) continue;
    if(hasActiveTruce(a.id,b.id)) continue;
    if(ownerTerritories(a.id).length===0 || ownerTerritories(b.id).length===0) continue;
    const adjacent = S.edges.some(([x,y])=> (byId(x).owner===a.id&&byId(y).owner===b.id) || (byId(x).owner===b.id&&byId(y).owner===a.id));
    if(adjacent) pairs.push([a,b]);
  }
  if(!pairs.length) return;
  const chance = 0.16 * tensionMultiplier();
  if(Math.random()>chance) return;
  const [a,b] = pairs[Math.floor(Math.random()*pairs.length)];
  const turnsLeft = 2+Math.floor(Math.random()*3);
  S.aiTruces.push({a:a.id, b:b.id, turnsLeft});
  notify('🕊️', `${a.name} y ${b.name} pactan una tregua temporal.`, 'info');
  addLog(`🕊️ ${a.name} y ${b.name} pactan una tregua de ${turnsLeft} turnos.`);
}
function rollAiEvents(){
  if(S.factions.length<=2) return;
  const chance = 0.16 * tensionMultiplier();
  aiFactions().forEach(f=>{
    if(ownerTerritories(f.id).length===0) return;
    if(Math.random()>chance) return;
    const ev = AI_EVENTS[Math.floor(Math.random()*AI_EVENTS.length)];
    const msg = ev.apply(f);
    if(!msg) return;
    addLog(`${ev.icon} ${f.name}: ${msg}`);
    notify(ev.icon, `${f.name}: ${msg}`, 'info');
  });
}

  notify('💀', `¡${nameOf(fallenId)} ha caído! Sus tierras pasan a manos de ${conquerorName}.`, 'epic', 7500);
  addLog(`💀💀 ¡${nameOf(fallenId)} ha caído por completo! Sus tierras pasan a manos de ${conquerorName}.`);
}

  if(S.toasts.length>6) S.toasts.shift();
  setTimeout(()=>{ if(!S) return; S.toasts = S.toasts.filter(t=>t.id!==id); render(); }, durationMs||4600);
}

const PROFILE_KEY = 'madridKingdom.profile.v1';
const SAVE_KEY = 'madridKingdom.save.v1';
let menuTab = 'quick';
let storyChapter = null;
let P = defaultProfile();
let cloud = { db:null, uid:null };

function defaultProfile(){
  return { version:1, gloria:0, gloriaTotal:0,
    upgrades:{ oro:0, tropas:0, vida:0, mana:0, accion:0 },
    achievements:{},
    stats:{ games:0, wins:0, bossKills:0, kingdomsDestroyed:0, bestTerritories:0 },
    story:{ unlocked:1, completed:[] },
    updatedAt:0 };
}
function mergeProfile(raw){
  const d = defaultProfile();
  if(!raw || typeof raw!=='object') return d;
  return { ...d, ...raw,
    upgrades:{ ...d.upgrades, ...(raw.upgrades||{}) },
    achievements:{ ...(raw.achievements||{}) },
    stats:{ ...d.stats, ...(raw.stats||{}) },
    story:{ ...d.story, ...(raw.story||{}), completed:[...((raw.story&&raw.story.completed)||[])] } };
}
function localRead(key){ try{ const v=localStorage.getItem(key); return v? JSON.parse(v) : null; }catch(e){ return null; } }
function localWrite(key,val){ try{ if(val===null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function cloudDoc(name){ return cloud.db && cloud.uid ? cloud.db.doc(`data/users/${cloud.uid}/${name}`) : null; }
function cloudWrite(name, val){
  const ref = cloudDoc(name); if(!ref) return;
  const body = val===null ? { empty:true, updatedAt:Date.now() } : { payload: JSON.stringify(val), updatedAt:(val.updatedAt||Date.now()) };
  ref.set(body).catch(()=>{});
}
function saveProfile(){
  P.updatedAt = Date.now();
  localWrite(PROFILE_KEY, P);
  cloudWrite('profile', P);
}
function readSavedGame(){ return localRead(SAVE_KEY); }
function writeSavedGame(snapshot){ localWrite(SAVE_KEY, snapshot); cloudWrite('savegame', snapshot); }

async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    cloud = { db, uid };
    const [pSnap, gSnap] = await Promise.all([cloudDoc('profile').get(), cloudDoc('savegame').get()]);
    if(pSnap && pSnap.exists){
      const body = pSnap.data();
      if(body && body.payload){
        const remote = mergeProfile(JSON.parse(body.payload));
        if((remote.updatedAt||0) > (P.updatedAt||0)){ P = remote; localWrite(PROFILE_KEY, P); }
        else if((P.updatedAt||0) > (remote.updatedAt||0)){ cloudWrite('profile', P); }
      }
    } else if(P.updatedAt){ cloudWrite('profile', P); }
    if(gSnap && gSnap.exists){
      const body = gSnap.data();
      const local = readSavedGame();
      if(body && body.payload){
        const remote = JSON.parse(body.payload);
        if(!local || (remote.updatedAt||0) > (local.updatedAt||0)) localWrite(SAVE_KEY, remote);
      } else if(body && body.empty && local && (body.updatedAt||0) > (local.updatedAt||0)){
        localWrite(SAVE_KEY, null);
      }
    }
    if(S && S.phase!=='play') render();
  }catch(e){ /* sin nube: seguimos con guardado local */ }
}

function applyChapterSetup(ch){
  const st = ch.setup || {};
  S.objective = ch.objective || {type:'standard'};
  S.maxTurns = ch.turns || 20;
  S.aiEnemyBias = st.aiEnemyBias || 0;
  if(st.playerLands===1){
    ownerTerritories('player').slice(1).forEach(t=>{ t.owner='neutral'; t.troops=3; t.tier=1; });
  }
  if(st.enemyLands){
    aiFactions().forEach(f=>{
      if(!isEnemyOf('player', f.id)) return;
      for(let k=0;k<st.enemyLands;k++){
        const own = ownerTerritories(f.id);
        const cand = S.territories.filter(t=>t.owner==='neutral' && !t.isBoss && neighbors(t.id).some(n=>byId(n).owner===f.id) && !neighbors(t.id).some(n=>byId(n).owner==='player'));
        if(!cand.length || !own.length) break;
        const t = cand[Math.floor(Math.random()*cand.length)];
        t.owner=f.id; t.troops=4; t.tier=2;
      }
    });
  }
  if(st.enemyTroops){
    S.territories.filter(t=>t.owner!=='player' && t.owner!=='neutral' && isEnemyOf('player', t.owner)).forEach(t=>{ t.troops=Math.max(1, t.troops+st.enemyTroops); });
  }
  if(st.playerGold) S.player.gold = Math.max(0, S.player.gold + st.playerGold);
  const bt = S.territories.find(t=>t.isBoss);
  if(bt && st.bossTroops){ bt.troops = st.bossTroops; bt.tier = 4; }
  S.bossRegen = st.bossRegen || 0;
  S.bossCap = st.bossCap || MAX_TROOPS;
}

function snapshotGame(){
  const copy = JSON.parse(JSON.stringify({ ...S, pendingDeal:null, pendingEvent:null, pendingLoot:null, toasts:[] }));
  copy.updatedAt = Date.now();
  copy.storyChapter = storyChapter;
  return copy;
}
function autosave(){
  if(S && S.mp) return;
  if(!S || S.phase!=='play' || S.over) return;
  writeSavedGame(snapshotGame());
}
function resumeSavedGame(){
  const snap = readSavedGame(); if(!snap) return;
  S = snap;
  S.diff = DIFFICULTIES[S.diffKey] || DIFFICULTIES.media;
  S.mode = GAME_MODES[S.modeKey] || GAME_MODES['1v1'];
  S.edges = voronoiAdjacency(S.territories, 960, 600).map(([a,b])=>[S.territories[a].id, S.territories[b].id]);
  S.toasts = []; S.pendingDeal=null; S.pendingEvent=null; S.pendingLoot=null;
  storyChapter = (snap.storyChapter===undefined) ? null : snap.storyChapter;
  pendingModal=null; selectedFrom=null; selectedTo=null;
  notify('💾', `Partida reanudada en el turno ${S.turn}.`, 'good');
  render();
}
function saveAndExit(){
  autosave();
  S = null; newGame(); pendingModal=null; menuTab='quick';
  render();
}
function discardSavedGame(){ writeSavedGame(null); render(); }

function computeGloria(){
  const base = { win_boss:30, win_total:25, win_objective:25, win_survive:22, win_count:15, draw:6 }[S.result] || 4;
  const diffMult = { facil:0.8, media:1, dificil:1.5 }[S.diffKey] || 1;
  const modeMult = S.modeKey==='ffa' ? 1.2 : (S.modeKey==='2v2' ? 1.1 : 1);
  const extra = ownerTerritories('player').length + (S.player?S.player.level:1)*2;
  const storyBonus = (storyChapter!==null && S.result && S.result.startsWith('win')) ? 15 : 0;
  return Math.round((base + extra) * diffMult * modeMult) + storyBonus;
}
function processGameEnd(){
  if(S.rewarded) return;
  S.rewarded = true;
  const won = S.result && S.result.startsWith('win');
  const gloria = computeGloria();
  S.gloriaEarned = gloria;
  P.gloria += gloria; P.gloriaTotal += gloria;
  P.stats.games++;
  if(won) P.stats.wins++;
  if(S.result==='win_boss') P.stats.bossKills++;
  P.stats.kingdomsDestroyed += (S.kingdomsDestroyed||0);
  P.stats.bestTerritories = Math.max(P.stats.bestTerritories, ownerTerritories('player').length);
  S.storyAdvanced = false;
  if(won && storyChapter!==null){
    if(!P.story.completed.includes(storyChapter)) P.story.completed.push(storyChapter);
    if(P.story.unlocked < Math.min(STORY.length, storyChapter+2)){ P.story.unlocked = Math.min(STORY.length, storyChapter+2); S.storyAdvanced = true; }
  }
  saveProfile();
  writeSavedGame(null);
  if(won) unlockAchievement('primera');
  if(S.result==='win_boss') unlockAchievement('jefe');
  if(won && !S.lostTerritory) unlockAchievement('intacto');
  if(won && S.turn<10) unlockAchievement('relampago');
  if(won && S.diffKey==='dificil') unlockAchievement('avanzado');
  if(won && S.modeKey==='ffa') unlockAchievement('caos');
  if(won && S.modeKey==='2v2') unlockAchievement('hermandad');
  if(P.story.completed.length>=STORY.length) unlockAchievement('historia');
  if(P.stats.games>=10) unlockAchievement('veterano');
}

function xpToNext(level){ return (S && S.mpLocal) ? 60 + level*20 : level*10; }

function newGame(){
  S = {
    turn:1, maxTurns:20, phase:'chooseClass',
    territories: [], edges: [], factions: [],
    player:null,
    ap:0,
    aiGold:{},
    reputation:0,
    grudges:{}, aiTruces:[],
    truceAI:0, aiPeaceTurns:0, dealCooldown:0, pendingDeal:null, pendingEvent:null,
    log:[], toasts:[],
    over:false, result:null,
  };
}

function startClass(key){
  const c = CLASSES[key];
  const chapter = storyChapter!==null ? STORY[storyChapter] : null;
  const diffKey = chapter ? chapter.diff : chosenDifficulty;
  const modeKey = chapter ? chapter.mode : chosenMode;
  const diff = DIFFICULTIES[diffKey];
  S.diffKey = diff.key;
  S.diff = diff;
  S.modeKey = modeKey;
  S.mode = GAME_MODES[modeKey];
  S.lostTerritory = false; S.dealsDone = 0; S.spellsCast = 0; S.kingdomsDestroyed = 0;

  const map = generateMap(modeKey, chapter ? { playerName:chapter.player, enemyNames:chapter.enemies, bossName:chapter.boss } : null);
  S.territories = map.territories;
  S.edges = map.edges;
  S.factions = map.factions;
  S.factions.filter(f=>!f.isPlayer).forEach(f=>{ S.aiGold[f.id] = 10; });
  S.grudges = {};
  S.aiTruces = [];

  S.territories.filter(t=>t.owner!=='player' && t.owner!=='neutral').forEach(t=>{
    t.troops = Math.max(1, t.troops + diff.startTroopsAdj);
  });
  const bossTile = S.territories.find(t=>t.isBoss);
  if(bossTile) bossTile.troops = Math.max(3, bossTile.troops + Math.round(diff.startTroopsAdj*0.6));

  S.player = {
    cls:key, level:1, xp:0, xpNext:xpToNext(1),
    hp:c.hp, maxHp:c.hp,
    mana:c.maxMana, maxMana:c.maxMana,
    str:c.str, mag:c.mag, cha:c.cha,
    gold:c.gold,
    weapon:'daga', vehicle:'ninguno',
    skillPoints:0,
    tree:{ofensiva:0, economica:0, magica:0},
    buffs:{ goldMultTurns:0, goldMultValue:1, atkBonusUses:0, atkBonusAmount:0, shieldUses:0 },
  };
  const U = P.upgrades;
  S.player.gold += (U.oro||0)*6;
  S.player.maxHp += (U.vida||0)*4; S.player.hp = S.player.maxHp;
  S.player.maxMana += (U.mana||0)*2; S.player.mana = S.player.maxMana;
  S.player.bonusApFlat = (U.accion||0);
  if(U.tropas) S.territories.filter(t=>t.owner==='player').forEach(t=>{ t.troops += U.tropas; });
  const trait = TRAITS[Math.floor(Math.random()*TRAITS.length)];
  S.player.trait = trait.key;
  S.player.traitName = trait.name;
  S.player.traitDesc = trait.desc;
  trait.apply(S.player, S.territories);
  S.activeModifiers = chapter ? [...chapter.mods] : [...chosenModifiers];
  MODIFIERS.filter(m=>S.activeModifiers.includes(m.key)).forEach(m=>{
    m.apply();
    addLog(`🎯 Modificador: ${m.name} — ${m.desc}`);
  });
  if(chapter) applyChapterSetup(chapter); else { S.objective={type:'standard'}; }
  S.phase = 'play';
  const playerFaction = S.factions.find(f=>f.isPlayer);
  addLog(`Comienzas tu leyenda al mando de ${playerFaction.name}, como ${c.label} ${c.emoji} · Modo: ${S.mode.label} · Dificultad: ${diff.label}.`);
  addLog(`🎲 Rasgo de nacimiento: ${trait.name} — ${trait.desc}`);
  beginPlayerTurn(true);
  notify('🎲', `Rasgo de nacimiento: ${trait.name} — ${trait.desc}`, 'unlock');
  MODIFIERS.filter(m=>S.activeModifiers.includes(m.key)).forEach(m=>{
    notify('🎯', `${m.name}: ${m.desc}`, 'unlock');
  });
  if(chapter) notify('📜', `Capítulo ${storyChapter+1}: ${chapter.title}`, 'epic', 6000);
  autosave();
  render();
}

function addLog(msg){ if(S.mpLogPrefix) msg = `${S.mpLogPrefix}: ${msg}`; S.log.push(msg); if(S.log.length>60) S.log.shift(); }

function atkStat(){ const c=CLASSES[S.player.cls]; return S.player[c.statUsed] + (S.player.bonusAtkFlat||0); }
function weaponBonus(){ return WEAPONS.find(w=>w.id===S.player.weapon).bonus; }

  if(hasVehicle('carreta')) return 3;
  if(hasVehicle('estandarte')) return 0;

}

function maxAp(){ return (S.mpLocal ? 4 : 3) + (hasVehicle('corcel')?1:0) + (S.player.bonusApFlat||0); }
