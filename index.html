// ================= SISTEMA MILITAR: gladiadores (tropas actuales) · escuderos · cañón =================
// Solo en multijugador. Sin escuderos ni cañones, todas las fórmulas dan exactamente lo mismo que antes.
const SHIELD_ATK = 0.3, SHIELD_DEF = 2.0, SHIELD_CAP = 20, CANNON_RANGE = 2, CANNON_MIN = 0.07, CANNON_SPREAD = 0.05, CANNON_SHIELD_SHARE = 0.6;
function unitsOn(){ return !!(S && S.mp); }
function shieldsOf(t){ return Math.max(0, t && t.shields || 0); }
function unitsOf(t){ return t.troops + shieldsOf(t); }
function attackForce(t){ return t.troops*TIERS[t.tier].mult + shieldsOf(t)*SHIELD_ATK; }
function defenseForce(t){ return t.troops*TIERS[t.tier].mult + shieldsOf(t)*SHIELD_DEF; }
function recruitBase(){ return S.mpLocal ? 3 : 4; }
function shieldCost(){ return Math.max(1, Math.round(recruitBase()*1.5) - passiveSum('reclutar')); }
function shieldRefund(){ return Math.max(1, Math.floor(shieldCost()*0.6)); }
function cannonCost(){ return recruitBase()*8; }
function mapDistances(fromId, maxD){
  const dist={[fromId]:0}, q=[fromId];
  while(q.length){ const c=q.shift(); if(dist[c]>=maxD) continue; neighbors(c).forEach(n=>{ if(dist[n]===undefined){ dist[n]=dist[c]+1; q.push(n); } }); }
  return dist;
}
function cannonTargets(fromId){
  const f=byId(fromId); if(!f || !f.cannon) return [];
  const dist=mapDistances(fromId, CANNON_RANGE);
  return S.territories.filter(t=>dist[t.id]>=1 && dist[t.id]<=CANNON_RANGE && t.owner!=='player' && isEnemyOf('player', t.owner)
    && !(S.truceAI>0 && t.owner!=='neutral' && !((factionOf(t.owner)||{}).human)));
}
function cannonsInRangeOf(targetId){ return S.territories.filter(t=>t.owner==='player' && t.cannon && cannonTargets(t.id).some(x=>x.id===targetId)); }
function cannonReady(t){ return !!(t && t.cannon && t.cannonTurn!==S.turn); }
// Pérdidas del atacante al fallar: primero gladiadores (siempre queda 1), luego escuderos.
function loseUnits(t, n){
  const g=Math.min(n, Math.max(0, t.troops-1)); t.troops-=g;
  const sh=Math.min(n-g, shieldsOf(t)); if(sh) t.shields=shieldsOf(t)-sh;
}
function recruitShields(territoryId, amount){
  if(mpIntercept('recruitShields', arguments)) return;
  if(!unitsOn()) return;
  const t=byId(territoryId), cost=shieldCost()*amount;
  if(!t || t.owner!=='player' || amount<1 || S.player.gold<cost || shieldsOf(t)+amount>SHIELD_CAP) return;
  S.player.gold-=cost; t.shields=shieldsOf(t)+amount;
  addLog(`🛡️ Reclutas ${amount} escudero(s) en ${t.name} (${cost} oro).`);
  render();
}
function sellShields(territoryId, amount){
  if(mpIntercept('sellShields', arguments)) return;
  if(!unitsOn()) return;
  const t=byId(territoryId);
  if(!t || t.owner!=='player' || amount<1 || shieldsOf(t)<amount) return;
  t.shields=shieldsOf(t)-amount; S.player.gold+=shieldRefund()*amount;
  addLog(`💰 Licencias ${amount} escudero(s) de ${t.name} (+${shieldRefund()*amount} oro).`);
  render();
}
function buildCannon(territoryId){
  if(mpIntercept('buildCannon', arguments)) return;
  if(!unitsOn()) return;
  const t=byId(territoryId), cost=cannonCost();
  if(!t || t.owner!=='player' || t.cannon || S.player.gold<cost) return;
  S.player.gold-=cost; t.cannon=true; t.cannonTurn=S.turn;
  addLog(`💣 Construyes un cañón en ${t.name} (${cost} oro). Podrá disparar desde tu próximo turno.`);
  render();
}
function fireCannon(fromId, toId){
  if(mpIntercept('fireCannon', arguments)) return;
  if(!unitsOn()) return;
  const f=byId(fromId), tg=byId(toId);
  if(!f || f.owner!=='player' || !cannonReady(f) || S.ap<1 || !tg || unitsOf(tg)<=1) return;
  if(!cannonTargets(fromId).some(t=>t.id===toId)) return;
  const units=unitsOf(tg);
  const dmg=Math.max(1, Math.round(units*(CANNON_MIN + Math.random()*CANNON_SPREAD)));
  let sd=Math.min(shieldsOf(tg), Math.ceil(dmg*CANNON_SHIELD_SHARE));
  let gd=Math.min(dmg-sd, Math.max(0, tg.troops-1));
  sd=Math.min(shieldsOf(tg), sd + (dmg-sd-gd));
  tg.troops-=gd; if(sd) tg.shields=shieldsOf(tg)-sd;
  S.ap-=1; f.cannonTurn=S.turn;
  const txt = `${gd?`${gd} gladiador(es)`:''}${gd&&sd?' y ':''}${sd?`${sd} escudero(s)`:''}`;
  addLog(`💣 Tu cañón en ${f.name} bombardea ${tg.name}: caen ${txt}. La tierra sigue siendo de ${nameOf(tg.owner)}.`);
  notify('💣', `¡Impacto en ${tg.name}! −${txt}`, 'good');
  if(S.mp && S.mp.seats[tg.owner]) S.mp.outbox.push({ to:tg.owner, icon:'💣', text:`¡Un cañón bombardeó ${tg.name}! Perdiste ${txt}.`, type:'bad' });
  render();
}

function minAttackTroops(){ return S.mpLocal ? 3 : 2; }
function defenseMult(){ return S.mpLocal ? 1.3 : 1.1; }
function defenseFlat(owner){ return owner!=='neutral' ? (S.mpLocal ? 3 : 2) : (S.mpLocal ? 1 : 0); }
function recruitCost(t){ return Math.max(1, (S.mpLocal ? 3 : 4) + (t.tier-1)*2 - passiveSum('reclutar')); }
function landIncomeAt(index){ return S.mpLocal ? (index < 6 ? 5 : 3) : 2; }
function manaCost(base){
  let reduce = (S.player.cls==='mago'?1:0) + (S.player.manaCostReduction||0);
  return Math.max(1, base-reduce);
}

function ownerTerritories(owner){ return S.territories.filter(t=>t.owner===owner); }
function neighbors(id){ const set=[]; S.edges.forEach(([a,b])=>{ if(a===id) set.push(b); if(b===id) set.push(a); }); return set; }
function byId(id){ return S.territories.find(t=>t.id===id); }
function territoryPower(t){ return t.troops * TIERS[t.tier].mult; }

function factionOf(id){ return S.factions.find(f=>f.id===id); }
function colorOf(ownerId){ if(ownerId==='neutral') return NEUTRAL_COLOR; const f=factionOf(ownerId); return f? f.color : NEUTRAL_COLOR; }
function nameOf(ownerId){ if(ownerId==='neutral') return 'Neutral'; const f=factionOf(ownerId); return f? f.name : ownerId; }
function isAllyOf(a,b){ if(a==='neutral'||b==='neutral') return false; if(a===b) return true; const fa=factionOf(a), fb=factionOf(b); return !!(fa && fb && fa.team===fb.team); }
function isEnemyOf(a,b){ if(a==='neutral'||b==='neutral') return true; if(a===b) return false; return !isAllyOf(a,b); }
function aiFactions(){ return S.factions.filter(f=>!f.isPlayer && !f.human); }
function enemyFactionsOfPlayer(){ return aiFactions().filter(f=>isEnemyOf('player', f.id)); }

function incomeBreakdown(){
  const lands = ownerTerritories('player').length;
  const base = S.mpLocal ? 6 : 3, perLand = landIncomeAt(0);
  let landGold = 0; for(let i=0;i<lands;i++) landGold += landIncomeAt(i);
  const tree = S.player.bonusGoldPerTurn||0, passive = passiveSum('oro');
  let underdog = 0;
  if(S.mpLocal && S.mp){
    const counts = S.factions.filter(f=>f.human || f.isPlayer).map(f=>ownerTerritories(f.id).length);
    if(counts.length && Math.max(...counts) - lands >= 3) underdog = 6;
  }
  let total = base + landGold + tree + passive + underdog;
  if(S.modIncomeMult) total = Math.round(total*S.modIncomeMult);
  if(S.modGoldBoost) total = Math.round(total*S.modGoldBoost);
  const buff = S.player.buffs.goldMultTurns>0;
  if(buff) total = Math.round(total*S.player.buffs.goldMultValue);
  return { base, perLand, lands, landGold, tree, passive, underdog, buff, total };
}
function beginPlayerTurn(first){
  if(!first){ S.turn++; }
  const owned = ownerTerritories('player');
  const inc = incomeBreakdown();
  let income = inc.total;
  S.player.gold += income;
  owned.forEach(t=>{
    let inc = 1 + (t.biome.passiveType==='regen' ? t.biome.passiveValue : 0);
    if(t.troops<MAX_TROOPS) t.troops=Math.min(MAX_TROOPS, t.troops+inc);
  });

  const manaRegen = CLASSES[S.player.cls].manaRegen + (S.player.manaRegenBonus||0) + passiveSum('mana');
  S.player.mana = Math.min(S.player.maxMana, S.player.mana+manaRegen);

  S.ap = maxAp();

  if(S.player.buffs.goldMultTurns>0) S.player.buffs.goldMultTurns--;
  if(S.player.buffs.odilioTurns>0){ S.player.buffs.odilioTurns--; if(S.player.buffs.odilioTurns===0) notify('✨', `Se desvanece el poder de ${S.player.buffs.odilioName||'Odilio'}.`, 'info'); }
  if(S.truceAI>0) S.truceAI--;
  if(S.aiPeaceTurns>0) S.aiPeaceTurns--;
  if(S.dealCooldown>0) S.dealCooldown--;

  addLog(`— Turno ${S.turn}: recibes ${income} de oro por tus tierras. —`);
  if(!first){
    notify('💰', S.mpLocal ? `Turno ${S.turn}: +${income} de oro · tus ${inc.lands} tierras dieron +${inc.landGold}${inc.passive?`, terrenos +${inc.passive}`:''}${inc.underdog?`, resistencia del pueblo +${inc.underdog}`:''}, base +${inc.base}.` : `Turno ${S.turn}: recibes ${income} de oro por tus tierras.`, 'info');
    if(S.player.skillPoints>0){
      notify('📈', `Tienes ${S.player.skillPoints} punto(s) de mejora sin usar. Ve a "Mejorar".`, 'info');
    }
  }

  let dealRolled = false;
  const dealChance = 0.25 + Math.max(0,S.reputation)*0.006;
  if(!first && !S.tutorial && S.turn>=3 && !S.pendingDeal && S.dealCooldown<=0 && S.reputation>-40 && Math.random()<dealChance){
    const deal = genIncomingDeal();
    if(deal){ S.pendingDeal = deal; pendingModal='dealIncoming'; dealRolled=true; }
  }
  if(!dealRolled && !first && !S.tutorial && S.turn>=2 && Math.random()<0.32){
    const ev = rollEvent();
    const msg = ev.apply();
    addLog(`${ev.icon} ${ev.name}: ${msg}`);
    S.pendingEvent = {icon:ev.icon, name:ev.name, desc:ev.desc, positive:ev.positive, resultMsg:msg};
    pendingModal='event';
  }
  checkGameEnd();
}

function endPlayerTurn(){
  if(mpIntercept('endPlayerTurn', arguments)) return;
  if(S.over) return;
  selectedFrom=null; selectedTo=null;
  runAllAiTurns();
  checkGameEnd();
  if(!S.over){
    if(S.turn>=S.maxTurns){ finishByCount(); return; }
    beginPlayerTurn(false);
    autosave();
  }
  render();
}

function combatRoll(power){ return power + (Math.floor(Math.random()*20)+1)/2; }

function availableAttacks(){
  return Object.entries(ATTACKS).filter(([k,a])=> !a.onlyFor || a.onlyFor===S.player.cls);
}

function openAttackChoice(fromId,toId){
  if(S.truceAI>0 && isEnemyOf('player', byId(toId).owner) && !((factionOf(byId(toId).owner)||{}).human)){ addLog('🕊️ Hay una tregua activa: no puedes atacar al enemigo todavía.'); render(); return; }
  selectedTo = toId;
  pendingModal='attackChoice';
  render();
}

function playerAttack(fromId,toId,attackKey){
  if(mpIntercept('playerAttack', arguments)) return;
  const from=byId(fromId), to=byId(toId);
  const atk = ATTACKS[attackKey];
  if(!from||!to||!atk) return;
  if(from.owner!=='player'||unitsOf(from)<minAttackTroops()) return;
  if(!neighbors(fromId).includes(toId) || !isEnemyOf('player', to.owner)) return;
  if(S.ap<atk.ap) return;
  const mCost = manaCost(atk.mana);
  if(atk.mana>0 && S.player.mana<mCost) return;

  S.ap -= atk.ap;
  if(atk.mana>0) S.player.mana -= mCost;

  let bonus=0;
  if(S.player.buffs.atkBonusUses>0){ bonus += S.player.buffs.atkBonusAmount; }
  if(odilioActive()){ bonus += (S.player.buffs.odilioAtk||0) + (atk.mana>0 ? (S.player.buffs.odilioMagic||0) : 0); }
  const originPassive = from.biome.passiveType==='ataque' ? from.biome.passiveValue : 0;

  let attackPower = combatRoll(attackForce(from)*atk.mult + (atkStat()+statBonusExtra())*0.5 + weaponBonus() + vehicleFlatBonus() + originPassive + bonus);
  if(odilioActive() && S.player.buffs.odilioCrit>0 && Math.random()<S.player.buffs.odilioCrit){ attackPower*=1.6; addLog('💥 ¡Golpe crítico de la Danza de Mil Filos!'); notify('💥','¡GOLPE CRÍTICO!','unlock'); }
  const defenderBonus = defenseFlat(to.owner);
  const terrainDef = to.biome.passiveType==='defensa' ? to.biome.passiveValue : 0;
  const defensePower = combatRoll(defenseForce(to)*defenseMult() + defenderBonus + terrainDef + castleBonus(to));

  if(S.player.buffs.atkBonusUses>0) S.player.buffs.atkBonusUses--;

  pendingModal=null; selectedFrom=null; selectedTo=null;

  if(attackPower > defensePower){
    const wasAI = to.owner!=='neutral';
    const wasBoss = to.isBoss;
    const fallenOwner = to.owner;
    const lost = Math.max(1, Math.round(to.troops*0.55));
    const moved = Math.max(1, Math.floor(from.troops*0.5));
    let gainGold = (S.player.cls==='picaro' ? 5 : 2) + (S.mpLocal ? 3 : 0);
    gainGold = Math.round(gainGold * (S.player.traitGoldMult||1) * (S.player.treeGoldMult||1));
    S.player.gold += gainGold;
    to.owner='player'; to.tier= wasBoss? to.tier : 1; to.troops=Math.max(1, moved-1); to.shields=0; to.cannon=false;
    if(from.troops<=1 && shieldsOf(from)>0) from.shields=shieldsOf(from)-1;
    from.troops = Math.max(1, from.troops - moved);
    let xpGain = 4 + Math.round(to.troops) + (wasBoss?15:0);
    xpGain = Math.round(xpGain * (1 + passiveSum('xp')/100) * (S.modDoubleXP?2:1));
    addLog(`${atk.icon} Conquistas ${to.name} con ${atk.name}. (+${xpGain} XP)`);
    gainXp(xpGain);
    if(wasAI){ S.reputation = Math.max(-100, S.reputation-4); addGrudge(fallenOwner, 'player', 6); }
    if(wasAI && ownerTerritories(fallenOwner).length===0){
      announceKingdomFall(fallenOwner, nameOf('player'));
      S.kingdomsDestroyed = (S.kingdomsDestroyed||0)+1;
      if(S.mpLocal) gainXp(12);
    }
    if(atk.healOnWin){ S.player.hp = Math.min(S.player.maxHp, S.player.hp+atk.healOnWin); }
    const lootCount = (wasBoss?2:1) + (S.modDoubleLoot?1:0);
    const loots = Array.from({length:lootCount}, ()=>rollLoot(to));
    loots.forEach(l=> addLog(`${l.icon} Botín: ${l.name} — ${l.desc}`));
    S.pendingLoot = loots;
    pendingModal='loot';
    if(wasBoss) notify('👑', `¡Conquistas ${to.name}, la fortaleza del enemigo!`, 'unlock');
    const dmg = Math.round(Math.random()*3)+1;
    S.player.hp = Math.max(0, S.player.hp-dmg);
  } else {
    let dmg = atk.failMin + Math.round(Math.random()*(atk.failMax-atk.failMin));
    dmg = Math.max(1, dmg - (S.player.failDmgReduction||0));
    dmg = Math.round(dmg * (S.player.traitDmgReduceMult||1));
    if(S.player.buffs.shieldUses>0){ dmg = Math.round(dmg/2); S.player.buffs.shieldUses--; addLog('🛡️ Tu escudo arcano absorbe parte del golpe.'); }
    if(odilioActive() && S.player.buffs.odilioGuard>0){ dmg = Math.round(dmg*(1-S.player.buffs.odilioGuard)); }
    if(S.mpLocal && S.mp && S.mp.seats[to.owner]) S.mp.seats[to.owner].pendingXp = (S.mp.seats[to.owner].pendingXp||0) + 2;
    loseUnits(from, atk.troopLossFail);
    S.player.hp = Math.max(0, S.player.hp-dmg);
    addLog(`🛡️ ${atk.name} contra ${to.name} falla. Pierdes ${atk.troopLossFail} tropa(s) y ${dmg} HP.`);
  }
  checkGameEnd();
  render();
}

function gainXp(amount){
  S.player.xp += amount;
  while(S.player.xp >= S.player.xpNext){
    S.player.xp -= S.player.xpNext;
    S.player.level++;
    S.player.xpNext = xpToNext(S.player.level);
    S.player.maxHp += 4;
    S.player.hp = S.player.maxHp;
    S.player.skillPoints++;
    addLog(`✨ ¡Subes a nivel ${S.player.level}! Vida al máximo y 1 punto de mejora ganado.`);
    notify('✨', `¡Subes a nivel ${S.player.level}! Vida al máximo y 1 punto de mejora ganado.`, 'unlock');
    if(S.mpLocal && S.mp && S.mp.active) grantOdilio();
  }
}

// ================= EL GRAN ODILIO (solo en "pasa el teléfono") =================
const ODILIO = {
  mago:     { name:'Meteoro Arcano',     icon:'☄️', color:'#9d8bff', stat:'mag', mult:1.4, statK:1.5, flat:16, best2:false,
              line:'El cielo se abre y la magia te obedece.', style:'Magia devastadora que cae del cielo.' },
  guerrero: { name:'Martillo del Titán', icon:'🔨', color:'#ff8a4c', stat:'str', mult:1.6, statK:1.2, flat:16, best2:false,
              line:'La fuerza de los titanes recorre tus venas.', style:'Un golpe brutal que sacude la tierra.' },
  picaro:   { name:'Tajo Relámpago',     icon:'⚡', color:'#46e6c9', stat:'cha', mult:1.4, statK:1.2, flat:14, best2:true,
              line:'Tus filos se vuelven relámpagos.', style:'Tan rápido y preciso que golpea dos veces antes de caer.' },
};
const ODILIO_RULE = 'Un solo uso · cuesta 1 PA · elige 2 territorios enemigos vecinos a tus tierras y Odilio los golpea a la vez. Si alguno resiste, pierde la mitad de sus tropas.';
function grantOdilio(){
  const p=S.player, def=ODILIO[p.cls]||ODILIO.guerrero;
  if(p.odilioCharge){ notify('✨', 'Tu barra se llenó otra vez, pero aún tienes tu Ataque del Gran Odilio sin usar.', 'info'); return; }
  p.odilioCharge = true;
  const hid=S.mp.active, seat=S.mp.seats[hid];
  S.mp.odilioSeq=(S.mp.odilioSeq||0)+1;
  (S.mp.odilio = S.mp.odilio||[]).push({ id:S.mp.odilioSeq, hid, name:seat.name, cls:p.cls, color:seat.color, crest:seat.crest||null,
    power:def.name, icon:def.icon, desc:ODILIO_RULE, style:def.style, line:def.line, level:p.level });
  if(S.mp.odilio.length>12) S.mp.odilio.shift();
  addLog(`✨ ¡${seat.name} alcanza EL GRAN ODILIO! Recibe el ataque especial ${def.name}.`);
}
function odilioTargets(){
  const out=[];
  S.territories.forEach(tg=>{
    if(tg.owner==='player' || !isEnemyOf('player', tg.owner)) return;
    if(S.truceAI>0 && tg.owner!=='neutral' && !((factionOf(tg.owner)||{}).human)) return;
    const src = neighbors(tg.id).map(byId).filter(n=>n.owner==='player' && unitsOf(n)>=minAttackTroops()).sort((a,b)=>attackForce(b)-attackForce(a))[0];
    if(src) out.push({tg, src});
  });
  return out;
}
function odilioStrike(id1, id2){
  if(mpIntercept('odilioStrike', arguments)) return;
  const p=S.player; if(!p || !p.odilioCharge || S.ap<1) return;
  const valid = odilioTargets();
  const ids = [id1, id2].filter((v,i,a)=>Number.isInteger(v) && v>0 && a.indexOf(v)===i);
  if(!ids.length || ids.some(id=>!valid.find(v=>v.tg.id===id))) return;
  if(ids.length<2 && valid.length>=2) return;
  const def=ODILIO[p.cls]||ODILIO.guerrero;
  S.ap-=1; p.odilioCharge=false;
  const results=[];
  ids.forEach(id=>{
    const v=odilioTargets().find(x=>x.tg.id===id) || valid.find(x=>x.tg.id===id);
    const src=v.src, tg=byId(id), fallen=tg.owner;
    const base = attackForce(src)*def.mult + (p[def.stat]||0)*def.statK + weaponBonus() + def.flat;
    let atk = combatRoll(base); if(def.best2) atk = Math.max(atk, combatRoll(base));
    const terrain = tg.biome.passiveType==='defensa' ? tg.biome.passiveValue : 0;
    const dfn = combatRoll(defenseForce(tg)*defenseMult() + defenseFlat(tg.owner) + terrain + castleBonus(tg));
    if(atk>dfn){
      const moved = Math.max(1, Math.floor(src.troops*0.4));
      tg.owner='player'; tg.tier = tg.isBoss ? tg.tier : 1; tg.troops = moved; tg.shields=0; tg.cannon=false; src.troops = Math.max(1, src.troops-moved);
      p.gold += 2 + (S.mpLocal?3:0);
      if(fallen!=='neutral'){ addGrudge(fallen,'player',6); if(ownerTerritories(fallen).length===0){ announceKingdomFall(fallen, nameOf('player')); S.kingdomsDestroyed=(S.kingdomsDestroyed||0)+1; } }
      results.push({ name:tg.name, won:true });
      addLog(`${def.icon} ${def.name}: ¡${tg.name} cae ante el poder de Odilio!`);
    } else {
      const lost = Math.ceil(tg.troops/2); tg.troops = Math.max(1, tg.troops-lost); if(shieldsOf(tg)) tg.shields=Math.floor(shieldsOf(tg)/2);
      results.push({ name:tg.name, won:false, lost });
      addLog(`${def.icon} ${def.name}: ${tg.name} resiste, pero pierde ${lost} tropas.`);
    }
  });
  if(S.mp){
    S.mp.strikeSeq=(S.mp.strikeSeq||0)+1;
    (S.mp.strikes = S.mp.strikes||[]).push({ id:S.mp.strikeSeq, hid:S.mp.active, cls:p.cls, name:def.name, icon:def.icon, color:def.color, results });
    if(S.mp.strikes.length>12) S.mp.strikes.shift();
  }
  render();
}
function odilioActive(p){ p=p||S.player; return !!(p && p.buffs && p.buffs.odilioTurns>0); }

// ================= MINIJUEGOS (solo en "pasa el teléfono") =================
const MINIGAMES = {
  reflejos: { name:'Reflejos',       icon:'🎯', desc:'Toca los objetivos antes de que desaparezcan.', max:20, k:1.0 },
  lluvia:   { name:'Lluvia de oro',  icon:'🪙', desc:'Atrapa monedas y gemas. ¡Evita las bombas!',  max:40, k:0.5 },
  tiro:     { name:'Tiro al blanco', icon:'🏹', desc:'Acierta cerca del centro: más puntos.',        max:45, k:0.45 },
};
const MINIGAME_GOLD_CAP = 18;
function minigameReward(key, score){
  const mg=MINIGAMES[key]; if(!mg) return {gold:0,xp:0};
  score=Math.max(0, Math.min(mg.max, Math.floor(Number(score)||0)));
  const gold=Math.min(MINIGAME_GOLD_CAP, Math.round(score*mg.k));
  return { score, gold, xp: (S && S.mpLocal) ? 1 + Math.floor(gold/9) : 2 + Math.floor(gold/6) };
}
function claimMinigame(key, score){
  if(mpIntercept('claimMinigame', arguments)) return;
  if(!S.mpLocal || !S.mp || !MINIGAMES[key]) return;
  const seat=S.mp.seats[S.mp.active];
  if(!seat || seat.minigameTurn===S.turn) return;
  const r=minigameReward(key, score);
  seat.minigameTurn=S.turn;
  S.player.gold+=r.gold;
  addLog(`${MINIGAMES[key].icon} Minijuego ${MINIGAMES[key].name}: ${r.score} puntos → +${r.gold} oro, +${r.xp} XP.`);
  gainXp(r.xp);
}

function rest(){
  if(mpIntercept('rest', arguments)) return;
  if(S.ap<1) return;
  S.ap -= 1;
  const heal = 9;
  S.player.hp = Math.min(S.player.maxHp, S.player.hp+heal);
  addLog(`🏕️ Descansas (1 PA) y recuperas ${heal} HP.`);
  render();
}

function recruit(territoryId, amount){
  if(mpIntercept('recruit', arguments)) return;
  const t = byId(territoryId);
  const perTroop = recruitCost(t);
  const cost = amount*perTroop;
  if(t.owner!=='player' || S.player.gold<cost) return;
  S.player.gold -= cost;
  t.troops = Math.min(MAX_TROOPS, t.troops+amount);
  addLog(`🪖 Reclutas ${amount} tropa(s) en ${t.name} (${cost} oro).`);
  render();
}

function trainTerritory(territoryId){
  if(mpIntercept('trainTerritory', arguments)) return;
  const t = byId(territoryId);
  if(t.owner!=='player' || t.tier>=4) return;
  const nextTier = t.tier+1;
  const cost = TIERS[nextTier].upgradeCost + t.troops*3;
  if(S.player.gold<cost) return;
  S.player.gold -= cost;
  t.tier = nextTier;
  addLog(`🎖️ ${t.name} entrena como ${TIERS[nextTier].name} (${cost} oro).`);
  if(S.mpLocal) gainXp(2);
  render();
}

function tradeSell(territoryId, amount){
  if(mpIntercept('tradeSell', arguments)) return;
  const t=byId(territoryId);
  if(t.owner!=='player' || t.troops-amount<1) return;
  const rate = (S.player.cls==='picaro' ? 4 : 3) + (S.player.bonusTradeRate||0);
  t.troops -= amount;
  S.player.gold += amount*rate;
  addLog(`💰 Mercado: vendes ${amount} tropa(s) de ${t.name} por ${amount*rate} de oro.`);
  render();
}

function buyWeapon(id){
  if(mpIntercept('buyWeapon', arguments)) return;
  const w = WEAPONS.find(w=>w.id===id);
  if(S.player.gold<w.cost || S.player.weapon===id) return;
  S.player.gold -= w.cost; S.player.weapon = id;
  if(S.mpLocal) gainXp(1);
  addLog(`🗡️ Adquieres: ${w.name}.`); render();
}
function buyVehicle(id){
  if(mpIntercept('buyVehicle', arguments)) return;
  const v = VEHICLES.find(v=>v.id===id);
  if(S.player.gold<v.cost || S.player.vehicle===id) return;
  S.player.gold -= v.cost; S.player.vehicle = id;
  if(S.mpLocal) gainXp(1);
  addLog(`🐎 Adquieres: ${v.name}.`); render();
}
function spendSkillPoint(stat){
  if(mpIntercept('spendSkillPoint', arguments)) return;
  if(S.player.skillPoints<=0) return;
  S.player.skillPoints--; S.player[stat]++;
  addLog(`📈 Mejoras tu ${stat==='str'?'Fuerza':stat==='mag'?'Magia':'Carisma'}.`);
  render();
}

function castSpell(key){
  if(mpIntercept('castSpell', arguments)) return;
  const sp = SPELLS[key];
  const cost = manaCost(sp.mana);
  if(S.player.mana<cost) return;
  S.player.mana -= cost;
  S.spellsCast = (S.spellsCast||0)+1;
  if(key==='fuerza'){ S.player.buffs.atkBonusUses=(S.player.buffs.atkBonusUses||0)+1; S.player.buffs.atkBonusAmount=6; }
  if(key==='escudo'){ S.player.buffs.shieldUses=(S.player.buffs.shieldUses||0)+1; }
  if(key==='curacion'){ S.player.hp=Math.min(S.player.maxHp, S.player.hp+12); }
  if(key==='fortuna'){ S.player.buffs.goldMultTurns=2; S.player.buffs.goldMultValue=1.5; }
  if(key==='transfer'){ pendingModal='transfer'; render(); addLog(`${sp.icon} Preparas una Transferencia.`); return; }
  addLog(`${sp.icon} Lanzas ${sp.name}.`);
  render();
}
function doTransfer(fromId,toId,amount){
  if(mpIntercept('doTransfer', arguments)) return;
  const a=byId(fromId), b=byId(toId);
  if(a.owner!=='player'||b.owner!=='player'||a.id===b.id) return;
  if(a.troops-amount<1) return;
  a.troops-=amount; b.troops=Math.min(MAX_TROOPS,b.troops+amount);
  addLog(`🌀 Transfieres ${amount} tropa(s) de ${a.name} a ${b.name}.`);
  transferFrom=null; pendingModal=null; render();
}

// ---------- DEALS ----------
function enemyTerritories(){ return S.territories.filter(t=>isEnemyOf('player', t.owner) && !((factionOf(t.owner)||{}).human)); }

function genIncomingDeal(){
  const kinds = S.modNoTruce ? ['ventaTerritorio','compraTropas'] : ['treguaOro','ventaTerritorio','compraTropas'];
  const kind = kinds[Math.floor(Math.random()*kinds.length)];
  if(kind==='treguaOro'){
    const gold = 10+Math.floor(Math.random()*15);
    const from = enemyFactionsOfPlayer(); const who = from.length? nameOf(from[Math.floor(Math.random()*from.length)].id) : 'El enemigo';
    return { text:`${who} ofrece ${gold} de oro si no le atacas durante 1 turno.`,
      accept(){ S.player.gold+=gold; S.truceAI=1; addLog(`🕊️ Aceptas la tregua y recibes ${gold} de oro.`); },
      decline(){ addLog('🚫 Rechazas la oferta de tregua.'); } };
  }
  if(kind==='ventaTerritorio'){
    const terrs = enemyTerritories(); if(!terrs.length) return genIncomingDealFallback();
    const t = terrs.reduce((a,b)=> a.troops<b.troops? a:b);
    const cost = 14+t.troops*3;
    return { text:`${nameOf(t.owner)} ofrece la tierra "${t.name}" a cambio de ${cost} de oro.`,
      accept(){ if(S.player.gold<cost){ addLog('No tienes oro suficiente para aceptar.'); return; } S.player.gold-=cost; t.owner='player'; addLog(`🤝 Adquieres ${t.name} por ${cost} de oro.`); },
      decline(){ addLog(`🚫 Rechazas la oferta por ${t.name}.`); } };
  }
  const mine=ownerTerritories('player'); if(!mine.length) return genIncomingDealFallback();
  const t = mine[Math.floor(Math.random()*mine.length)];
  const amount = Math.min(2, Math.max(0,t.troops-1));
  if(amount<1) return genIncomingDealFallback();
  const pay = amount*6;
  const from = enemyFactionsOfPlayer(); const who = from.length? nameOf(from[Math.floor(Math.random()*from.length)].id) : 'El enemigo';
  return { text:`${who} propone comprar ${amount} tropa(s) de "${t.name}" por ${pay} de oro.`,
    accept(){ t.troops-=amount; S.player.gold+=pay; addLog(`💰 Vendes ${amount} tropa(s) de ${t.name} por ${pay} de oro.`); },
    decline(){ addLog('🚫 Rechazas la propuesta de compra.'); } };
}
function genIncomingDealFallback(){
  const gold = 8+Math.floor(Math.random()*10);
  return { text:`El enemigo ofrece ${gold} de oro si no lo atacas durante 1 turno.`,
    accept(){ S.player.gold+=gold; S.truceAI=1; addLog(`🕊️ Aceptas la tregua y recibes ${gold} de oro.`); },
    decline(){ addLog('🚫 Rechazas la oferta de tregua.'); } };
}
function resolveDeal(accepted){
  if(mpIntercept('resolveDeal', arguments)) return;
  const deal = S.pendingDeal;
  if(!deal){ pendingModal=null; render(); return; }
  if(accepted){ deal.accept(); S.dealsDone=(S.dealsDone||0)+1; S.reputation = Math.min(100, S.reputation+5); notify('🕊️', 'Aceptas el trato con el enemigo.', 'good'); }
  else { deal.decline(); S.reputation = Math.max(-100, S.reputation-3); notify('🚫', 'Rechazas el trato del enemigo.', 'bad'); }
  S.pendingDeal=null; S.dealCooldown=2; pendingModal=null;
  checkGameEnd(); render();
}
function attemptOutgoing(key){
  if(mpIntercept('attemptOutgoing', arguments)) return;
  if(S.dealCooldown>0) return;
  if(S.modNoTruce && (key==='tregua'||key==='alianza')){ addLog('🚫 La Guerra Total impide negociar treguas o alianzas.'); notify('🚫','Guerra Total: no puedes negociar treguas ni alianzas.','bad'); return; }
  const chanceBase = 40 + S.player.cha*3 + S.reputation*0.3 + (S.player.traitDealBonus||0);
  if(key==='tregua'){
    const cost=20;
    if(S.player.gold<cost) return;
    S.player.gold-=cost;
    const ok = Math.random()*100 < chanceBase;
    if(ok){ S.dealsDone=(S.dealsDone||0)+1; S.truceAI=2; S.reputation=Math.min(100,S.reputation+5); addLog('🕊️ El enemigo acepta tu propuesta de tregua por 2 turnos.'); notify('🕊️','El enemigo acepta tu tregua por 2 turnos.','good'); }
    else { S.reputation=Math.max(-100,S.reputation-2); addLog('🚫 El enemigo rechaza tu propuesta de tregua. Pierdes el oro ofrecido.'); notify('🚫','El enemigo rechaza tu propuesta de tregua.','bad'); }
  }
  if(key==='compra'){
    const terrs = enemyTerritories(); if(!terrs.length) return;
    const t = terrs.reduce((a,b)=> a.troops<b.troops? a:b);
    const sellerName = nameOf(t.owner);
    const cost = 16+t.troops*3;
    if(S.player.gold<cost) return;
    S.player.gold-=cost;
    const ok = Math.random()*100 < (chanceBase-10);
    if(ok){ S.dealsDone=(S.dealsDone||0)+1; t.owner='player'; S.reputation=Math.min(100,S.reputation+5); addLog(`🤝 ${sellerName} acepta vender ${t.name} por ${cost} de oro.`); notify('🤝',`Adquieres ${t.name} por ${cost} de oro.`,'good'); }
    else { S.reputation=Math.max(-100,S.reputation-2); addLog('🚫 El enemigo rechaza tu oferta de compra. Pierdes el oro ofrecido.'); notify('🚫','El enemigo rechaza tu oferta de compra.','bad'); }
  }
  if(key==='alianza'){
    const cost=25;
    if(S.player.gold<cost) return;
    S.player.gold-=cost;
    const ok = Math.random()*100 < chanceBase;
    if(ok){ S.dealsDone=(S.dealsDone||0)+1; S.aiPeaceTurns=3; S.reputation=Math.min(100,S.reputation+5); addLog('🤝 El enemigo acepta una alianza temporal: atacará con menos fuerza 3 turnos.'); notify('🤝','El enemigo acepta una alianza temporal.','good'); }
    else { S.reputation=Math.max(-100,S.reputation-2); addLog('🚫 El enemigo rechaza tu propuesta de alianza. Pierdes el oro ofrecido.'); notify('🚫','El enemigo rechaza tu propuesta de alianza.','bad'); }
  }
  S.dealCooldown=2;
  checkGameEnd(); render();
}

// ---------- AI ----------
// ================= IA estratégica (usa exactamente las mismas reglas de combate que el jugador) =================
const AI_BRAIN = {
  facil:   { minChance:.62, finishChance:.5,  elimBonus:12, leaderBonus:0,  mistake:.3,  moves:0, reinforces:1, stage:false, expandUntil:99, superiority:1.6 },
  media:   { minChance:.55, finishChance:.33, elimBonus:45, leaderBonus:14, mistake:.06, moves:2, reinforces:1, stage:true,  expandUntil:11, superiority:1.45 },
  dificil: { minChance:.5,  finishChance:.25, elimBonus:60, leaderBonus:18, mistake:0,   moves:3, reinforces:1, stage:true,  expandUntil:8,  superiority:1.25 },
};
// combatRoll(p) = p + d20/2  →  gana el atacante si (a-b) > 2*(def-atk), con a,b en 1..20
const ROLL_DIFF = (()=>{ const c={}; for(let a=1;a<=20;a++) for(let b=1;b<=20;b++){ const k=a-b; c[k]=(c[k]||0)+1; } return c; })();
function winProb(atk, def){ const need=2*(def-atk); let n=0; for(let k=-19;k<=19;k++) if(k>need) n+=ROLL_DIFF[k]; return n/400; }
function aiAttackPower(t){ return attackForce(t)+S.diff.atkBonus; }
function defenderStat(owner){
  if(owner==='player') return atkStat();
  if(S.mp && S.mp.seats[owner]){ const p=S.mp.seats[owner].player; return p[CLASSES[p.cls].statUsed] + (p.bonusAtkFlat||0); }
  return 0;
}
function aiDefensePower(target){
  const isHuman = target.owner==='player' || !!(S.mp && S.mp.seats[target.owner]);
  const defPassive = isHuman && target.biome.passiveType==='defensa' ? target.biome.passiveValue : 0;
  return defenseForce(target)*defenseMult() + (S.mpLocal ? defenseFlat(target.owner) : 0) + (isHuman? defenderStat(target.owner)*0.2:0) + defPassive + castleBonus(target);
}
function updatePeakLands(){
  S.peakLands = S.peakLands || {};
  S.territories.forEach(t=>{ if(t.owner!=='neutral'){ const n=ownerTerritories(t.owner).length; if(n>(S.peakLands[t.owner]||0)) S.peakLands[t.owner]=n; } });
}
// Un reino está "a punto de caer" si le queda una tierra y ya tuvo más (o si la partida ya avanzó).
function isWeakenedLastStand(owner){
  if(owner==='neutral' || ownerTerritories(owner).length!==1) return false;
  const brain = AI_BRAIN[S.diffKey] || AI_BRAIN.media;
  return ((S.peakLands||{})[owner]||1) > 1 || S.turn >= brain.expandUntil;
}
function leaderOwner(){
  const counts={}; S.territories.forEach(t=>{ if(t.owner!=='neutral') counts[t.owner]=(counts[t.owner]||0)+1; });
  const ids=Object.keys(counts); if(ids.length<2) return null;
  ids.sort((a,b)=>counts[b]-counts[a]);
  const avg = ids.reduce((s,k)=>s+counts[k],0)/ids.length;
  return counts[ids[0]] >= Math.max(4, avg*1.35) ? ids[0] : null;
}
function aiTargetValue(factionId, target){
  const castleV = (S.mp && S.mp.goal==='castles' && target.castle && target.castle===target.owner && target.owner!==factionId) ? 22 : 0;
  const brain = AI_BRAIN[S.diffKey] || AI_BRAIN.media;
  const expanding = S.turn < brain.expandUntil && S.territories.some(t=>t.owner==='neutral' && !t.isBoss);
  let v = target.owner==='neutral' ? (expanding ? 13 : 7) : (expanding ? 5 : 11);
  if(isWeakenedLastStand(target.owner)) v += brain.elimBonus;
  const leader = leaderOwner();
  if(!expanding && leader && target.owner===leader && leader!==factionId) v += brain.leaderBonus;
  if(target.owner==='player' && S.aiEnemyBias) v += S.aiEnemyBias;
  if(['defensa','oro'].includes(target.biome.passiveType)) v += 4;
  v += ((S.grudges[factionId]||{})[target.owner]||0)*1.5;
  if(target.isBoss) v -= 6;
  return v + (typeof castleV!=='undefined' ? castleV : 0);
}
function aiCandidateAttacks(factionId){
  const out=[];
  const neutralsLeft = S.territories.some(t=>t.owner==='neutral' && !t.isBoss);
  ownerTerritories(factionId).forEach(src=>{
    if(unitsOf(src)<2) return;
    neighbors(src.id).map(byId).forEach(tg=>{
      if(!isEnemyOf(factionId, tg.owner) || hasActiveTruce(factionId, tg.owner)) return;
      if(tg.owner==='player' && (S.truceAI>0 || S.aiSleepTurns>0)) return;
      if(S.mp && S.mp.seats[tg.owner] && S.mp.seats[tg.owner].truceAI>0) return;
      const chance = winProb(aiAttackPower(src), aiDefensePower(tg));
      const brain = AI_BRAIN[S.diffKey] || AI_BRAIN.media;
      // Contra reinos sanos exige superioridad real de tropas (como un general prudente); contra un reino a punto de caer, no.
      if(tg.owner!=='neutral' && !isWeakenedLastStand(tg.owner)){
        if(attackForce(src) < defenseForce(tg)*brain.superiority + 1) return;
        const provoked = ((S.grudges[factionId]||{})[tg.owner]||0) > 0;
        if(S.turn < brain.expandUntil && !provoked) return;
      }
      const value = aiTargetValue(factionId, tg);
      out.push({ src, tg, chance, value, score: chance*value - (1-chance)*8, eliminates: isWeakenedLastStand(tg.owner) });
    });
  });
  return out;
}
function aiResolveAttack(factionId, src, target){
  const isVsPlayer = target.owner==='player';
  const atkPower = combatRoll(aiAttackPower(src));
  const defPower = combatRoll(aiDefensePower(target));
  if(atkPower>defPower){
    const fallenOwner = target.owner;
    const lost = Math.max(1, Math.round(target.troops*0.55));
    addLog(`🩸 ${isVsPlayer? 'Tus tropas caen ante '+nameOf(factionId)+': ':nameOf(factionId)+' toma '}${target.name}${isVsPlayer?'':' (de '+nameOf(fallenOwner)+')'}.`);
    if(isVsPlayer){ notify('🩸', `¡Pierdes ${target.name} ante ${nameOf(factionId)}!`, 'bad'); S.lostTerritory = true; }
    else if(fallenOwner!=='neutral') addGrudge(fallenOwner, factionId, 6);
    target.owner=factionId; target.tier=Math.max(1,target.tier-1); target.shields=0; target.cannon=false;
    target.troops = Math.max(1, Math.floor(src.troops*0.5));
    src.troops = Math.max(1, src.troops - lost);
    if(isVsPlayer){ S.player.hp = Math.max(0, S.player.hp-3); }
    else if(fallenOwner!=='neutral' && ownerTerritories(fallenOwner).length===0){ announceKingdomFall(fallenOwner, nameOf(factionId)); }
    return true;
  }
  src.troops = Math.max(1, src.troops-2);
  if(S.mpLocal && S.mp && S.mp.seats[target.owner]) S.mp.seats[target.owner].pendingXp = (S.mp.seats[target.owner].pendingXp||0) + 2;
  if(isVsPlayer) addLog(`🛡️ Repeles el ataque de ${nameOf(factionId)} sobre ${target.name}.`);
  return false;
}
// Distancia (en saltos por tierras propias) hasta el frente, para mover tropas del interior hacia donde hacen falta.
function aiFrontDistances(factionId, focusIds){
  const owned = ownerTerritories(factionId); const dist={}; const q=[];
  owned.forEach(t=>{ if(focusIds.includes(t.id)){ dist[t.id]=0; q.push(t.id); } });
  while(q.length){ const c=q.shift(); neighbors(c).forEach(n=>{ const nt=byId(n); if(nt.owner===factionId && dist[n]===undefined){ dist[n]=dist[c]+1; q.push(n); } }); }
  return dist;
}
function aiTurnForFaction(factionId){
  const diff = S.diff;
  const brain = AI_BRAIN[S.diffKey] || AI_BRAIN.media;
  const owned = ownerTerritories(factionId);
  owned.forEach(t=>{ if(t.troops<MAX_TROOPS) t.troops++; });
  S.aiGold[factionId] = (S.aiGold[factionId]||10) + diff.income + owned.length;

  const isEnemyOfPlayer = isEnemyOf('player', factionId);
  const multiFaction = S.factions.length>2;
  if(isEnemyOfPlayer && S.truceAI>0 && !multiFaction){ addLog(`🕊️ ${nameOf(factionId)} respeta la tregua y no ataca este turno.`); return; }
  if(isEnemyOfPlayer && S.aiSleepTurns>0){ addLog(`😴 ${nameOf(factionId)} aún dormita y no ataca este turno.`); return; }

  let maxAttacks = (isEnemyOfPlayer && S.aiPeaceTurns>0) ? 1 : diff.maxAttacks;
  if(isEnemyOfPlayer){
    if(S.reputation<=-40) maxAttacks += 1;
    else if(S.reputation>=40) maxAttacks = Math.max(1, maxAttacks-1);
  }
  if(multiFaction) maxAttacks += 1 + Math.floor(tensionMultiplier()-1);
  maxAttacks += (S.aiExtraAttacks||0);

  // 1) Plan: ¿hay alguien a punto de caer? Esa es la meta del turno.
  let cands = aiCandidateAttacks(factionId);
  const finisher = brain.stage ? cands.filter(c=>c.eliminates).sort((a,b)=>b.chance-a.chance)[0] : null;
  const threatened = owned.filter(t=>neighbors(t.id).some(n=>{ const nt=byId(n); return isEnemyOf(factionId, nt.owner) && nt.owner!=='neutral' && territoryPower(nt) > territoryPower(t); }));

  // 2) Preparación: mover tropas del interior hacia el objetivo o hacia la frontera amenazada.
  if(brain.moves>0 && (finisher || threatened.length)){
    const focus = finisher ? [finisher.src.id] : threatened.map(t=>t.id);
    const dist = aiFrontDistances(factionId, focus);
    let moves=0;
    const interior = ownerTerritories(factionId).filter(t=>dist[t.id]>0 && t.troops>2).sort((a,b)=>b.troops-a.troops);
    for(const t of interior){
      if(moves>=brain.moves) break;
      const step = neighbors(t.id).map(byId).filter(n=>n.owner===factionId && dist[n.id]!==undefined && dist[n.id]<dist[t.id]).sort((a,b)=>dist[a.id]-dist[b.id])[0];
      if(!step) continue;
      const amount = t.troops-1; t.troops=1; step.troops=Math.min(MAX_TROOPS, step.troops+amount); moves++;
    }
  }

  // 3) Refuerzos: al punto de ataque planeado, o a la frontera más amenazada.
  let reinforces=0;
  while(S.aiGold[factionId]>=diff.reinforceCost && reinforces<brain.reinforces){
    let spot = null;
    if(finisher && finisher.src.owner===factionId) spot = finisher.src;
    else if(threatened.length) spot = threatened.slice().sort((a,b)=>territoryPower(a)-territoryPower(b))[0];
    else { const borders = ownerTerritories(factionId).filter(t=>neighbors(t.id).some(n=>isEnemyOf(factionId, byId(n).owner))); spot = borders.sort((a,b)=>a.troops-b.troops)[0]; }
    if(!spot) break;
    spot.troops = Math.min(MAX_TROOPS, spot.troops+diff.reinforceAmt);
    S.aiGold[factionId]-=diff.reinforceCost; reinforces++;
  }

  // 4) Ataques: siempre re-evalúa el mejor movimiento; rematar a un reino va primero.
  let attacksDone=0, finishAttempts=0; const usedSrc=new Set();
  while(attacksDone<maxAttacks){
    cands = aiCandidateAttacks(factionId).filter(c=>c.eliminates || !usedSrc.has(c.src.id));
    if(!cands.length) break;
    let pick=null;
    const kills = cands.filter(c=>c.eliminates && c.chance>=brain.finishChance).sort((a,b)=>b.chance-a.chance);
    if(kills.length) pick = kills[0];
    else if(brain.mistake>0 && Math.random()<brain.mistake){
      const ok = cands.filter(c=>c.chance>=0.4); pick = ok.length ? ok[Math.floor(Math.random()*ok.length)] : null;
      if(!pick) break;
    } else {
      const viable = cands.filter(c=>c.chance>=brain.minChance).sort((a,b)=>b.score-a.score);
      // Si hay un remate en preparación, no gastar ese ejército en otra cosa.
      pick = viable.find(c=>!(finisher && c.src.id===finisher.src.id && !c.eliminates)) || null;
    }
    if(!pick) break;
    const won = aiResolveAttack(factionId, pick.src, pick.tg);
    usedSrc.add(pick.src.id); attacksDone++;
    if(pick.eliminates && !won){ finishAttempts++; if(finishAttempts>=2) break; }
  }
}
function runAllAiTurns(){

function objectiveText(obj, turns, bossName){

function checkGameEnd(){
  if(S.mp) return;
  if(S.over) return;
  const obj = S.objective || {type:'standard'};
  const playerCount = ownerTerritories('player').length;
  const enemyFactionIds = enemyFactionsOfPlayer().map(f=>f.id);
  const enemiesAlive = enemyFactionIds.filter(id=>ownerTerritories(id).length>0).length;
  const bossTile = S.territories.find(t=>t.isBoss);
  const bossTaken = bossTile && bossTile.owner==='player';
  if(S.player.hp<=0){ S.over=true; S.result='lose_hp'; addLog('💀 Tu personaje ha caído en batalla.'); return; }
  if(playerCount===0){ S.over=true; S.result='lose_land'; addLog('🏳️ Pierdes todas tus tierras.'); return; }
  if(obj.type==='boss'){
    if(bossTaken){ S.over=true; S.result='win_boss'; addLog(`👑 ¡Derrotas a ${bossTile.name} y conquistas la fortaleza del enemigo!`); }
    return;
  }
  if(obj.type==='eliminate'){
    if(enemiesAlive===0){ S.over=true; S.result='win_total'; addLog('👑 ¡Eliminas a todos los reinos enemigos!'); }
    return;
  }
  if(obj.type==='dominate'){
    if(playerCount>=obj.n){ S.over=true; S.result='win_objective'; addLog(`🗺️ ¡Controlas ${playerCount} tierras y cumples el objetivo!`); }
    else if(enemiesAlive===0){ S.over=true; S.result='win_total'; addLog('👑 ¡Eliminas a todos los reinos enemigos!'); }
    return;
  }
  if(obj.type==='survive'){
    if(enemiesAlive===0){ S.over=true; S.result='win_total'; addLog('👑 ¡Eliminas a todos los reinos enemigos!'); }
    return;
  }
  if(bossTaken){ S.over=true; S.result='win_boss'; addLog(`👑 ¡Derrotas a ${bossTile.name} y conquistas la fortaleza del enemigo!`); }
  else if(enemiesAlive===0){ S.over=true; S.result='win_total'; addLog('👑 ¡Conquistas o eliminas a todos los reinos rivales!'); }
  else if(playerCount>=13){ S.over=true; S.result='win_total'; addLog('👑 ¡Dominas la mayor parte del reino!'); }
}
function finishByCount(){
  if(S.mp){ mpFinishByCount(); return; }
  const obj = S.objective || {type:'standard'};
  const playerCount = ownerTerritories('player').length;
  const enemyFactionIds = enemyFactionsOfPlayer().map(f=>f.id);
  const enemyCount = S.territories.filter(t=>enemyFactionIds.includes(t.owner)).length;
  S.over=true;
  if(obj.type==='survive') S.result = playerCount>0 ? 'win_survive' : 'lose_land';
  else if(obj.type!=='standard') S.result='lose_objective';
  else if(playerCount>enemyCount) S.result='win_count';
  else if(enemyCount>playerCount) S.result='lose_count';
  else S.result='draw';
  render();
}

function renameOwner(from,to){

  S.factions.forEach(f=>{ if(f.id===from) f.id=to; });

    if(S.grudges[from]){ S.grudges[to]=S.grudges[from]; delete S.grudges[from]; }
    Object.values(S.grudges).forEach(m=>{ if(m[from]!==undefined){ m[to]=m[from]; delete m[from]; } });

  (S.aiTruces||[]).forEach(tr=>{ if(tr.a===from) tr.a=to; if(tr.b===from) tr.b=to; });

const MP_ACTIONS = { recruit, tradeSell, trainTerritory, buyWeapon, buyVehicle, spendSkillPoint, castSpell, doTransfer, rest, unlockTreeNode, attemptOutgoing, resolveDeal, playerAttack, claimMinigame, odilioStrike, recruitShields, sellShields, buildCannon, fireCannon };
function mpFingerprint(){ return JSON.stringify([S.player, S.ap, S.territories.map(t=>[t.owner,t.troops,t.tier,t.shields||0,!!t.cannon,t.cannonTurn||0]), S.reputation, S.truceAI, S.aiPeaceTurns, S.dealCooldown, !!S.pendingDeal]); }
function mpAct(hid, name, args){
  if(!S.mp || S.over) return {ok:false, error:'La partida ya terminó.'};
  const seat=S.mp.seats[hid];
  if(!seat || seat.eliminated) return {ok:false, error:'Ya no estás en la partida.'};
  if(S.mp.order[S.mp.current]!==hid) return {ok:false, error:'No es tu turno.'};
  if(!Object.prototype.hasOwnProperty.call(MP_ACTIONS, name)) return {ok:false, error:'Acción desconocida.'};
  args = Array.isArray(args) ? args.slice(0,4) : [];
  if(args.some(a=>!['number','string','boolean'].includes(typeof a) || (typeof a==='string' && a.length>24))) return {ok:false, error:'Datos inválidos.'};
  const ownersBefore = S.territories.map(t=>t.owner);
  mpSwapIn(hid);
  let error=null; const effects={};
  if(name==='spendSkillPoint' && !['str','mag','cha'].includes(args[0])) error='Atributo inválido.';
  if(name==='unlockTreeNode' && !Object.prototype.hasOwnProperty.call(SKILL_TREE, args[0])) error='Rama inválida.';
  if(name==='attemptOutgoing' && !['tregua','compra','alianza'].includes(args[0])) error='Trato inválido.';
  if(name==='castSpell' && !Object.prototype.hasOwnProperty.call(SPELLS, args[0])) error='Hechizo inválido.';
  if(name==='buyWeapon' && !WEAPONS.find(w=>w.id===args[0])) error='Arma inválida.';
  if(name==='buyVehicle' && !VEHICLES.find(v=>v.id===args[0])) error='Montura inválida.';
  if(['recruit','tradeSell','trainTerritory'].includes(name) && !(byId(args[0]) && byId(args[0]).owner==='player')) error='Ese territorio no es tuyo.';
  if(['recruit','tradeSell'].includes(name) && !(Number.isInteger(args[1]) && args[1]>=1 && args[1]<=3)) error='Cantidad inválida.';
  if(name==='doTransfer' && !(Number.isInteger(args[2]) && args[2]>=1 && args[2]<=3)) error='Cantidad inválida.';
  if(name==='doTransfer' && !S.transferReady) error='Primero lanza el hechizo de Transferencia.';
  if(name==='resolveDeal' && !S.pendingDeal) error='No hay ningún trato pendiente.';
  if(name==='odilioStrike' && !(S.player && S.player.odilioCharge)) error='No tienes el Ataque del Gran Odilio.';
  if(['recruitShields','sellShields','buildCannon'].includes(name)){ const t=byId(args[0]); if(!t || t.owner!=='player') error='Ese territorio no es tuyo.'; }
  if(['recruitShields','sellShields'].includes(name) && !error && !(Number.isInteger(args[1]) && args[1]>=1 && args[1]<=3)) error='Cantidad inválida.';
  if(name==='recruitShields' && !error){ const t=byId(args[0]); if(shieldsOf(t)+args[1]>SHIELD_CAP) error=`Máximo ${SHIELD_CAP} escuderos por territorio.`; else if(S.player.gold<shieldCost()*args[1]) error=`Necesitas ${shieldCost()*args[1]} de oro.`; }
  if(name==='sellShields' && !error && shieldsOf(byId(args[0]))<args[1]) error='No tienes tantos escuderos ahí.';
  if(name==='buildCannon' && !error){ const t=byId(args[0]); if(t.cannon) error='Ese territorio ya tiene un cañón (máximo 1).'; else if(S.player.gold<cannonCost()) error=`Necesitas ${cannonCost()} de oro.`; }
  if(name==='fireCannon'){ const f=byId(args[0]), tg=byId(args[1]);
    if(!f || f.owner!=='player' || !f.cannon) error='No tienes un cañón en ese territorio.';
    else if(!cannonReady(f)) error='Ese cañón ya disparó o se construyó este turno.';
    else if(S.ap<1) error='Necesitas 1 PA para disparar.';
    else if(!tg || !cannonTargets(args[0]).some(t=>t.id===args[1])) error=`Objetivo fuera del alcance del cañón (${CANNON_RANGE} conexiones) o no válido.`;
    else if(unitsOf(tg)<=1) error='Ese territorio ya no puede debilitarse más: hay que conquistarlo por tierra.'; }
  if(name==='claimMinigame' && (!S.mpLocal || !MINIGAMES[args[0]] || seat.minigameTurn===S.turn)) error='El minijuego ya se usó en este turno.';
  if(name==='playerAttack'){
    const tg=byId(args[1]);
    if(!tg) error='Territorio inválido.';
    else if(!availableAttacks().some(([k])=>k===args[2])) error='Ese ataque no está disponible para tu clase.';
    else if(S.truceAI>0 && tg.owner!=='neutral' && !((factionOf(tg.owner)||{}).human)) error='Tienes una tregua activa con ese reino.';
  }
  if(!error){
    const before=mpFingerprint();
    try{ MP_ACTIONS[name](...args); } catch(e){ error='Acción inválida.'; }
    if(!error && before===mpFingerprint()) error='No se pudo realizar: revisa oro, maná, tropas, PA o vecindad.';
    if(!error && name==='castSpell' && args[0]==='transfer') S.transferReady=true;
    if(!error && name==='doTransfer') S.transferReady=false;
    if(S.pendingLoot){ effects.loot=S.pendingLoot.map(l=>({icon:l.icon,name:l.name,desc:l.desc})); S.pendingLoot=null; }
  }
  if(!error) mpCheckMilestones();
  mpSwapOut();
  mpLandLossDamage(ownersBefore, hid);
  mpCastleSweep();
  mpCheckEnd();
  return {ok:!error, error, effects};
}
function mpLandLossDamage(before, actor){

function mpCastleSweep(){

  S.territories.forEach(t=>{

const MILESTONES = {

function milestoneValue(kind){
  if(kind==='troops') return ownerTerritories('player').reduce((a,t)=>a+unitsOf(t),0);
  if(kind==='gold') return S.player.gold;
  return S.player.level;

// Se ejecuta con el jugador "sentado" (S.player = su personaje).
function mpCheckMilestones(){
  if(!S.mpLocal || !S.mp || !S.mp.active) return;
  const seat=S.mp.seats[S.mp.active]; if(!seat) return;
  seat.milestones = seat.milestones || {troops:0,gold:0,level:0}; seat.badges = seat.badges || [];
  for(let guard=0; guard<12; guard++){
    let changed=false;
    Object.entries(MILESTONES).forEach(([kind,def])=>{
      const idx=seat.milestones[kind]||0, step=def.steps[idx];
      if(!step || milestoneValue(kind) < step.at) return;
      seat.milestones[kind]=idx+1; changed=true;
      const parts=[];
      if(step.gold){ S.player.gold+=step.gold; parts.push(`+${step.gold} oro`); }
      if(step.troops){ const spot = S.territories.find(t=>t.owner==='player' && t.castle==='player') || ownerTerritories('player').sort((a,b)=>b.troops-a.troops)[0]; if(spot){ spot.troops=Math.min(MAX_TROOPS, spot.troops+step.troops); parts.push(`+${step.troops} tropas en ${spot.name}`); } }
      const title = kind==='level' ? `${def.label}: nivel ${step.at}` : `${def.label}: ${step.at} ${def.unit}`;
      seat.badges.push({ icon:def.icon, title, reward:parts.concat(step.xp?[`+${step.xp} XP`]:[]).join(', ') });
      addLog(`🏅 Logro · ${title} → ${parts.concat(step.xp?[`+${step.xp} XP`]:[]).join(', ')}`);
      notify('🏅', `¡Logro! ${def.icon} ${title} → ${parts.concat(step.xp?[`+${step.xp} XP`]:[]).join(', ')}`, 'epic');

function mpCheckEnd(){
  if(!S.mp || S.over || S.tutorial) return;
  S.mp.order.forEach(hid=>{
    const seat=S.mp.seats[hid]; if(seat.eliminated) return;
    if(seat.player.hp<=0) mpEliminate(hid,'cayó en batalla');
    else if(ownerTerritories(hid).length===0) mpEliminate(hid,'perdió todas sus tierras');
  });
  const alive = S.mp.order.filter(h=>!S.mp.seats[h].eliminated);
  const aliveAI = aiFactions().filter(f=>ownerTerritories(f.id).length>0);
  const goal = mpGoal();
  if(goal==='castles'){
    const standingAI = aiFactions().filter(f=>S.territories.some(t=>t.castle===f.id));
    if(alive.length===0) return mpEndGame(null, 'Los castillos humanos cayeron ante la IA');
    if(alive.length===1 && standingAI.length===0) return mpEndGame(alive[0], 'Su castillo es el último en pie');
    return;
  }
  if(goal==='dominion'){
    if(alive.length===0) return mpEndGame(null, 'Los reinos de la IA conquistaron el mapa');
    if(alive.length===1 && aliveAI.length===0 && S.mp.order.length>1) return mpEndGame(alive[0], 'Último reino en pie');
    return;
  }
  if(goal==='conquest'){
    if(alive.length===0) return mpEndGame(null, 'Los reinos de la IA conquistaron el mapa');
    if(alive.length===1 && aliveAI.length===0) return mpEndGame(alive[0], 'Conquistó a todos los reinos rivales');
    return;
  }
  const boss = S.territories.find(t=>t.isBoss);
  if(boss && S.mp.seats[boss.owner] && !S.mp.seats[boss.owner].eliminated) return mpEndGame(boss.owner, `Conquistó ${boss.name}`);
  if(alive.length===0) return mpEndGame(null, 'Los reinos de la IA conquistaron el mapa');
  if(alive.length===1 && aliveAI.length===0 && S.mp.order.length>1) return mpEndGame(alive[0], 'Último reino en pie');
  if(alive.length===1 && aliveAI.length===0 && S.mp.order.length===1) return mpEndGame(alive[0], 'Eliminó a todos los rivales');
  const dom = alive.find(h=>ownerTerritories(h).length>=13);
  if(dom) return mpEndGame(dom, 'Dominó el mapa');
}
function mpFinishByCount(){
  const counts = S.factions.map(f=>({id:f.id, human:!!f.human, n:ownerTerritories(f.id).length, tr:ownerTerritories(f.id).reduce((a,t)=>a+t.troops,0)}))
    .filter(c=>c.n>0 && !(S.mp.seats[c.id] && S.mp.seats[c.id].eliminated)).sort((a,b)=>(b.n-a.n)||(b.tr-a.tr));
  if(!counts.length) return mpEndGame(null, 'Nadie quedó en pie');
  const top=counts[0];
  if(counts[1] && counts[1].n===top.n && counts[1].tr===top.tr) return mpEndGame(null, 'Empate exacto en tierras y tropas');
  if(counts[1] && counts[1].n===top.n && top.human) return mpEndGame(top.id, `Empate en tierras (${top.n}), pero con más tropas (${top.tr})`);
  if(top.human) return mpEndGame(top.id, `Más tierras al terminar los turnos (${top.n})`);
  return mpEndGame(null, `${nameOf(top.id)} (IA) tiene más tierras al terminar los turnos`);
}

let AUDIO_CTX = null;
function sfx(kind){
  try{
    AUDIO_CTX = AUDIO_CTX || new (window.AudioContext||window.webkitAudioContext)();
    if(AUDIO_CTX.state==='suspended') AUDIO_CTX.resume();
    const t0 = AUDIO_CTX.currentTime;
    const tone=(f,st,dur,type,vol,slide)=>{ const o=AUDIO_CTX.createOscillator(), g=AUDIO_CTX.createGain(); o.type=type||'sine';
      o.frequency.setValueAtTime(f,t0+st); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t0+st+dur);
      g.gain.setValueAtTime(0.0001,t0+st); g.gain.exponentialRampToValueAtTime(vol||0.12,t0+st+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+st+dur);
      o.connect(g); g.connect(AUDIO_CTX.destination); o.start(t0+st); o.stop(t0+st+dur+0.05); };

const MG = { active:false };
function mgAvailable(){
  if(!(S && S.mp && S.mpLocal && MP.online && mpIsMyTurn() && !S.over)) return false;
  const seat = S.mp.seats[MP.me]; return !!seat && seat.minigameTurn!==S.turn;
}
function startMinigame(key){
  const mg = MINIGAMES[key]; if(!mg || MG.active) return;
  MG.active = true;
  // Online: el servidor anota cuándo empezó para validar el premio al terminar.
  if(MP.socket && !MP.socket.local) MP.socket.emit('mgStart', {key}, ()=>{});
  const DUR = window.__MK_MG_MS || 10000;
  const ov = document.createElement('div'); ov.className='mg-overlay';
  ov.innerHTML = `<div class="mg-top"><span class="mg-title">${mg.icon} ${mg.name}</span><span class="mg-score">0</span><span class="mg-time">${(DUR/1000).toFixed(1)}s</span></div>
    <div class="mg-bar"><div class="mg-bar-fill"></div></div>
    <div class="mg-arena"><div class="mg-hint">${mg.desc}<br><b>¡Ya!</b></div></div>`;
  document.body.appendChild(ov);
  const arena = ov.querySelector('.mg-arena'), scoreEl = ov.querySelector('.mg-score'), timeEl = ov.querySelector('.mg-time'), barEl = ov.querySelector('.mg-bar-fill');
  setTimeout(()=>{ const h=ov.querySelector('.mg-hint'); if(h) h.remove(); }, 900);
  const size = ()=>{ const r=arena.getBoundingClientRect(); return { w:r.width||360, h:r.height||520 }; };
  let score=0, t=0, last=performance.now(), spawnAcc=0, done=false, items=[];
  const addScore = (n, x, y, label)=>{
    score = Math.max(0, score+n); scoreEl.textContent = score;
    const pop = document.createElement('div'); pop.className='mg-pop '+(n<0?'neg':''); pop.textContent = label || ((n>0?'+':'')+n);
    pop.style.left=x+'px'; pop.style.top=y+'px'; arena.appendChild(pop); setTimeout(()=>pop.remove(), 600);
  };
  const tapHandler = (el, fn)=>{ const h=e=>{ e.preventDefault(); e.stopPropagation(); fn(e); }; el.addEventListener('pointerdown', h); el.addEventListener('click', h); };
  function spawn(){
    const {w,h} = size();
    if(key==='reflejos'){
      const el=document.createElement('div'); el.className='mg-target'; el.innerHTML='🎯';
      const x=30+Math.random()*(w-60), y=30+Math.random()*(h-60);
      el.style.left=x+'px'; el.style.top=y+'px'; arena.appendChild(el);
      const it={el, life:1.15}; items.push(it);
      tapHandler(el, ()=>{ if(it.dead) return; it.dead=true; el.classList.add('hit'); sfx('tap'); addScore(1,x,y); setTimeout(()=>el.remove(),150); });
    }
    if(key==='lluvia'){
      const r=Math.random(); const type = r<0.08 ? 'gem' : (r<0.3 ? 'bomb' : 'coin');
      const el=document.createElement('div'); el.className='mg-drop '+type; el.innerHTML = type==='gem'?'💎':(type==='bomb'?'💣':'🪙');
      const x=24+Math.random()*(w-48); el.style.left=x+'px'; el.style.top='-30px'; arena.appendChild(el);
      const it={el, x, y:-30, v:170+Math.random()*120, type}; items.push(it);
      tapHandler(el, ()=>{ if(it.dead) return; it.dead=true; el.remove();
        if(type==='bomb'){ sfx('bad'); ov.classList.add('mg-shake'); setTimeout(()=>ov.classList.remove('mg-shake'),300); addScore(-3,it.x,it.y); }
        else { sfx('coin'); addScore(type==='gem'?3:1,it.x,it.y); } });
    }
    if(key==='tiro'){
      if(items.filter(i=>!i.dead).length>=3) return;
      const el=document.createElement('div'); el.className='mg-bullseye';
      const R=38, x=R+Math.random()*(w-2*R), y=R+Math.random()*(h-2*R), ang=Math.random()*Math.PI*2, sp=70+Math.random()*90;
      el.style.left=x+'px'; el.style.top=y+'px'; arena.appendChild(el);
      const it={el, x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, R}; items.push(it);
      tapHandler(el, e=>{ if(it.dead) return;
        const rect=el.getBoundingClientRect(); const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
        const dist = (e.clientX!=null && rect.width) ? Math.hypot(e.clientX-cx, e.clientY-cy)/(rect.width/2) : 0;
        const pts = dist<=0.34 ? 3 : (dist<=0.67 ? 2 : 1);
        it.dead=true; el.classList.add('hit'); sfx(pts===3?'coin':'tap'); addScore(pts, it.x, it.y, pts===3?'¡Diana! +3':'+'+pts); setTimeout(()=>el.remove(),150); });
    }
  }
  const every = key==='reflejos' ? 0.6 : (key==='lluvia' ? 0.32 : 0.25);
  function frame(now){
    if(done) return;
    const dt = Math.min(0.05, (now-last)/1000); last=now; t+=dt*1000; spawnAcc+=dt;
    while(spawnAcc>=every){ spawnAcc-=every; spawn(); }
    const {w,h} = size();
    items.forEach(it=>{
      if(it.dead) return;
      if(key==='reflejos'){ it.life-=dt; if(it.life<=0){ it.dead=true; it.el.classList.add('gone'); setTimeout(()=>it.el.remove(),150); } }
      if(key==='lluvia'){ it.y+=it.v*dt; it.el.style.top=it.y+'px'; if(it.y>h+30){ it.dead=true; it.el.remove(); } }
      if(key==='tiro'){ it.x+=it.vx*dt; it.y+=it.vy*dt; if(it.x<it.R||it.x>w-it.R) it.vx*=-1; if(it.y<it.R||it.y>h-it.R) it.vy*=-1;
        it.x=Math.max(it.R,Math.min(w-it.R,it.x)); it.y=Math.max(it.R,Math.min(h-it.R,it.y)); it.el.style.left=it.x+'px'; it.el.style.top=it.y+'px'; }
    });
    items = items.filter(i=>!i.dead || i.el.isConnected);
    const left=Math.max(0, DUR-t); timeEl.textContent=(left/1000).toFixed(1)+'s'; barEl.style.width=(100*left/DUR)+'%';
    if(left<=0) return finish();
    requestAnimationFrame(frame);
  }
  function finish(){
    done=true; sfx('end');
    arena.querySelectorAll('.mg-target,.mg-drop,.mg-bullseye').forEach(e=>e.remove());
    const r = minigameReward(key, score);
    const panel=document.createElement('div'); panel.className='mg-result';
    panel.innerHTML=`<div class="mg-res-title">¡Tiempo!</div><div class="mg-res-score">${r.score} puntos</div><div class="mg-res-reward">+${r.gold} 🪙 oro · +${r.xp} ✨ XP</div><button class="primary big-btn">Volver al turno</button>`;
    arena.appendChild(panel);
    claimMinigame(key, score);
    let closed=false; const close=()=>{ if(closed) return; closed=true; ov.remove(); MG.active=false; render(); runOdilioQueue(); };
    panel.querySelector('button').addEventListener('click', close);
    setTimeout(close, 2600);
  }
  requestAnimationFrame(t=>{ last=t; requestAnimationFrame(frame); });
}

// ================= MULTIJUGADOR EN EL MISMO TELÉFONO ("pasa el teléfono") =================
// Usa exactamente el mismo motor multijugador; el "servidor" corre dentro del propio teléfono.
const HUMAN_COLORS = ['#3f7f52','#2f6fb5','#b23a3a','#c98b1f','#7a4bb0'];
const LOCAL_KEY = 'madridKingdom.local.v1';
const LOCAL = { active:false, srv:null, players:[], inServer:false, inbox:{}, awaitingPass:false, lastHid:null,
  setup:{ players:[{name:'',cls:'guerrero'},{name:'',cls:'mago'}], ai:0, diff:'media', goal:'castles' } };
function ensureSetupIdentity(){
  const used = new Set();
  LOCAL.setup.players.forEach(pl=>{ if(pl.color && !used.has(pl.color)) used.add(pl.color); else pl.color=null; });
  LOCAL.setup.players.forEach(pl=>{ if(!pl.color){ pl.color = IDENTITY_COLORS.find(c=>!used.has(c)); used.add(pl.color); } if(!pl.crest) pl.crest = randomCrest(); });
}
function mpServerSide(){ return !!(window.__MK_SERVER || LOCAL.inServer); }
function localServerRun(fn){
  const view=S, ui={pendingModal, selectedFrom, selectedTo, inspectId, transferFrom};
  S=LOCAL.srv; LOCAL.inServer=true;
  try{ return fn(); }
  finally{ LOCAL.srv=S; LOCAL.inServer=false; S=view; pendingModal=ui.pendingModal; selectedFrom=ui.selectedFrom; selectedTo=ui.selectedTo; inspectId=ui.inspectId; transferFrom=ui.transferFrom; }
}
function localRoom(){
  return { code:'LOCAL', status: LOCAL.srv && LOCAL.srv.over ? 'over' : 'playing', hostId:null, settings:{},
    players: LOCAL.players.map(p=>({ id:p.id, name:p.name, color:p.color, cls:p.cls, hid:p.hid, connected:true, host:false })) };
}
function localSave(){
  if(TUT.active || !LOCAL.srv) return;
  if(LOCAL.srv.over){ localWrite(LOCAL_KEY, null); return; }
  const srv = localServerRun(()=>mpSnapshot());
  localWrite(LOCAL_KEY, { srv, players:LOCAL.players, inbox:LOCAL.inbox, lastHid:LOCAL.lastHid, savedAt:Date.now() });
}
function localPublish(){
  const out = localServerRun(()=>({ state:mpSnapshot(), outbox:S.mp.outbox.splice(0) }));
  const state = out.state;
  const cur = state.mp.order[state.mp.current];
  const humans = LOCAL.players.length;
  if(humans>1 && !state.over && LOCAL.lastHid && LOCAL.lastHid!==cur) LOCAL.awaitingPass = true;
  LOCAL.lastHid = cur;
  MP.myId = (LOCAL.players.find(p=>p.hid===cur)||LOCAL.players[0]).id;
  mpApplyState({ state, room:localRoom() });
  out.outbox.forEach(m=>{
    if(m.to==='*' || m.to===cur || humans===1) notify(m.icon, m.text, m.type);
    else (LOCAL.inbox[m.to] = LOCAL.inbox[m.to] || []).push(m);
  });
  localSave();
  render();
}
const localSocket = {
  local:true,
  emit(ev, data, cb){
    const hid = LOCAL.lastHid;
    let res = {ok:true};
    if(ev==='action') res = localServerRun(()=>mpAct(hid, (data||{}).name, (data||{}).args));
    else if(ev==='endTurn') res = localServerRun(()=>mpEndTurn(hid, false));
    else { if(cb) cb({ok:true}); return; }
    if(cb) cb(res);
    localPublish();
  },
  disconnect(){}
};
function localAttachSocket(){
  if(MP.socket && !MP.socket.local){ try{ MP.socket.disconnect(); }catch(e){} }
  MP.socket = localSocket; MP.online=true; MP.connected=true; MP.hidden=false; MP.lastPayload=null; MP.lastTurnKey=null; MP.seenEventKey=null;
}
function localStart(){
  const cfg = LOCAL.setup;
  const used = new Set();
  LOCAL.players = cfg.players.map((p,i)=>{
    let name = (p.name||'').replace(/[<>&"'`]/g,'').trim().slice(0,16) || `Jugador ${i+1}`;
    while(used.has(name.toLowerCase())) name = name + ' ' + (i+1);
    used.add(name.toLowerCase());
    return { id:'p'+i, hid:'h'+i, name, cls:p.cls, color:p.color||IDENTITY_COLORS[i], crest:p.crest||randomCrest() };
  });
  LOCAL.inbox = {}; LOCAL.players.forEach(p=>{ LOCAL.inbox[p.hid]=[]; });
  LOCAL.srv = null; LOCAL.active = true; LOCAL.lastHid = null;
  localServerRun(()=>{ mpStartGame({ local:true, goal: cfg.goal||'castles', humans: LOCAL.players.map(p=>({hid:p.hid, name:p.name, color:p.color, cls:p.cls, crest:p.crest})), ai: Math.min(cfg.ai, 5-LOCAL.players.length), diff: cfg.diff }); });
  localAttachSocket(); MP.seenOdilio = 0; ODILIO_QUEUE.length = 0; MP.seenStrike = 0; STRIKE_QUEUE.length = 0;
  LOCAL.awaitingPass = LOCAL.players.length>1;
  selectedFrom=null; inspectId=null; pendingModal=null;
  localPublish();
}
function localResume(){
  const saved = localRead(LOCAL_KEY); if(!saved || !saved.srv) return;
  const srv = saved.srv;
  srv.mp.outbox = []; srv.mp.active = null;
  Object.values(srv.mp.seats).forEach(seat=>{ seat.pendingDeal=null; });
  srv.diff = DIFFICULTIES[srv.diffKey] || DIFFICULTIES.media;
  LOCAL.srv = srv; LOCAL.players = saved.players; LOCAL.inbox = saved.inbox || {}; LOCAL.lastHid = saved.lastHid;
  LOCAL.active = true; localAttachSocket();
  MP.seenOdilio = Math.max(0, ...((srv.mp.odilio||[]).map(e=>e.id))); ODILIO_QUEUE.length = 0;
  MP.seenStrike = Math.max(0, ...((srv.mp.strikes||[]).map(e=>e.id))); STRIKE_QUEUE.length = 0;
  LOCAL.awaitingPass = LOCAL.players.length>1;
  selectedFrom=null; inspectId=null; pendingModal=null;
  localPublish();
}
function localPause(){
  if(TUT.active){ tutExit(false); return; }
  localSave();
  LOCAL.active=false; LOCAL.awaitingPass=false; MP.online=false; MP.socket=null; MP.room=null; MP.me=null;
  newGame(); menuTab='local'; pendingModal=null; selectedFrom=null; inspectId=null; render();
}

  const box = el(`
    <div class="pass-screen">
      <div class="pass-card">
        <div class="pass-ico">📱</div>
        <h2>Pásale el teléfono a</h2>
        <div class="pass-name" style="color:${cur.color}">${shieldSVG(cur.crest, cur.color, 44)}${cur.name}</div>
        <p class="hint">Turno ${S.turn} de ${S.maxTurns} · ${CLASSES[cur.player.cls].emoji} ${CLASSES[cur.player.cls].label}</p>

        <button class="ghost big-btn pass-exit">Guardar y salir al menú</button>
      </div>
    </div>`);
  box.querySelector('.primary').addEventListener('click', ()=>{
    LOCAL.awaitingPass=false;
    const inbox = LOCAL.inbox[hid] || [];
    if(inbox.length) notify('📜', `Mientras no tenías el teléfono pasaron ${inbox.length} cosa(s):`, 'info', 7000);
    inbox.slice(-5).forEach(m=>notify(m.icon, m.text, m.type, 7000));
    LOCAL.inbox[hid] = [];
    localSave(); render(); setTimeout(runOdilioQueue, 120);
  });
  box.querySelector('.pass-exit').addEventListener('click', localPause);
  return box;
}
function renderLocalTab(){
  const box = el(`<div class="mp-tab"></div>`);
  const saved = localRead(LOCAL_KEY);
  if(saved && saved.srv && !saved.srv.over){
    const names = (saved.players||[]).map(p=>p.name).join(', ');
    const c = el(`<div class="continue-box"><b>💾 Partida guardada en este teléfono</b><p class="hint" style="margin:2px 0 8px;">${(MP_GOALS[(saved.srv.mp||{}).goal]||MP_GOALS.classic).icon} ${(MP_GOALS[(saved.srv.mp||{}).goal]||MP_GOALS.classic).name} · ${names} · Turno ${saved.srv.turn}/${saved.srv.maxTurns}</p><div class="btnrow" style="justify-content:center;"></div></div>`);
    const b1=el(`<button class="primary">Continuar partida</button>`); b1.addEventListener('click', localResume);
    const b2=el(`<button class="ghost">Descartar</button>`); b2.addEventListener('click', ()=>{ if(confirm('¿Borrar la partida guardada?')){ localWrite(LOCAL_KEY,null); render(); } });
    c.querySelector('.btnrow').append(b1,b2); box.appendChild(c);
  }
  const st = LOCAL.setup; ensureSetupIdentity();
  box.appendChild(el(`<p class="hint">Jueguen por turnos en este mismo teléfono. Cada quien elige nombre, color, escudo y personaje. Al terminar su turno, se lo pasan al siguiente.</p>`));
  box.appendChild(el(`<h3 style="margin:6px 0;">Modo de juego</h3>`));
  box.appendChild(goalPickerEl(LOCAL_GOALS, st.goal||'castles', k=>{ st.goal=k; render(); }, false));
  box.appendChild(el(`<h3 style="margin:14px 0 6px;">Jugadores</h3>`));
  const list = el(`<div class="local-list"></div>`);
  st.players.forEach((pl,i)=>{
    const row = el(`
      <div class="local-row">
        <div class="local-top"><button class="crest-btn" aria-label="Escudo al azar">${shieldSVG(pl.crest, pl.color, 40)}<small>🎲</small></button>
          <input class="mp-input local-name" maxlength="16" placeholder="Jugador ${i+1}" value="${(pl.name||'').replace(/"/g,'&quot;')}"/>
          ${st.players.length>2?'<button class="mp-kick" aria-label="Quitar jugador">✕</button>':''}</div>
        ${identityToolsHTML(pl.crest)}
        <div class="mp-classes local-cls"></div>
      </div>`);
    row.querySelector('.local-name').addEventListener('input', e=>{ pl.name = e.target.value; });
    const rm = row.querySelector('.mp-kick'); if(rm) rm.addEventListener('click', ()=>{ st.players.splice(i,1); render(); });
    const taken = new Set(st.players.filter(o=>o!==pl).map(o=>o.color));
    wireIdentityTools(row, pl, taken, ch=>{ if(ch.color) pl.color=ch.color; if(ch.crest) pl.crest=ch.crest; render(); });
    const cls = row.querySelector('.local-cls');
    Object.entries(CLASSES).forEach(([k,c])=>{
      const b=el(`<button class="${pl.cls===k?'tab-active':''}"><span style="font-size:20px">${c.emoji}</span><span>${c.label}</span></button>`);
      b.addEventListener('click', ()=>{ pl.cls=k; render(); });
      cls.appendChild(b);
    });
    list.appendChild(row);
  });
  box.appendChild(list);
  const maxHumans = 5 - st.ai;
  if(st.players.length < Math.min(5, maxHumans)){
    const add = el(`<button class="big-btn" style="width:100%;margin-top:8px;">➕ Agregar jugador</button>`);
    add.addEventListener('click', ()=>{ st.players.push({name:'', cls:['guerrero','mago','picaro'][st.players.length%3]}); ensureSetupIdentity(); render(); });
    box.appendChild(add);
  }
  box.appendChild(el(`<h3 style="margin:14px 0 6px;">Reinos de la IA</h3>`));
  const aiRow = el(`<div class="mp-seg"></div>`);
  for(let n=0;n<=5-st.players.length;n++){ const b=el(`<button class="${st.ai===n?'tab-active':''}">${n}</button>`); b.addEventListener('click', ()=>{ st.ai=n; render(); }); aiRow.appendChild(b); }
  box.appendChild(aiRow);
  if(st.ai>0){
    const dRow = el(`<div class="mp-seg" style="margin-top:6px;"></div>`);
    Object.values(DIFFICULTIES).forEach(d=>{ const b=el(`<button class="${st.diff===d.key?'tab-active':''}">${d.emoji} ${d.label}</button>`); b.addEventListener('click', ()=>{ st.diff=d.key; render(); }); dRow.appendChild(b); });
    box.appendChild(dRow);
  }
  const go = el(`<button class="primary big-btn" style="width:100%;margin-top:14px;">▶️ Empezar partida</button>`);
  go.addEventListener('click', ()=>{
    if(saved && saved.srv && !saved.srv.over && !confirm('Hay una partida guardada. ¿Empezar una nueva y reemplazarla?')) return;
    localStart();
  });
  box.appendChild(go);
  return box;
}

      const pad=6; r={ l:Math.max(0,b.left-pad), t:Math.max(0,b.top-pad), r:Math.min(vw,b.right+pad), b:Math.min(vh,b.bottom+pad) };

function milestonesHTML(seat){
  const ms = seat.milestones || {troops:0,gold:0,level:0};
  const rows = Object.entries(MILESTONES).map(([k,def])=>{
    const idx = ms[k]||0, step = def.steps[idx];
    const now = milestoneValue(k);
    const next = step ? `${Math.min(now, step.at)}/${step.at} ${def.unit} → ${[step.gold?`+${step.gold} oro`:'', step.troops?`+${step.troops} tropas`:'', step.xp?`+${step.xp} XP`:''].filter(Boolean).join(', ')}` : '¡Completado!';
    const pct = step ? Math.min(100, Math.round(100*now/step.at)) : 100;
    return `<div class="ms-row"><div class="ms-top"><span>${def.icon} ${def.label} ${'★'.repeat(idx)}${'☆'.repeat(def.steps.length-idx)}</span><small>${next}</small></div><div class="bar-track"><div class="bar-fill xp" style="width:${pct}%"></div></div></div>`;
  }).join('');
  const got = (seat.badges||[]).slice(-6).reverse().map(b=>`<div class="ms-badge">${b.icon} ${b.title} <small>${b.reward}</small></div>`).join('');
  return `<h3 style="margin:12px 0 6px;">🏅 Logros de la partida</h3>${rows}${got?`<div style="margin-top:8px;">${got}</div>`:''}`;
}

const ODMODE = { active:false, picks:[] };
function odilioCharge(){ return !!(S && S.player && S.player.odilioCharge); }
function enterOdilioMode(){
  if(!odilioCharge()) return;
  if(S.mp && !mpIsMyTurn()){ notify('⏳','Espera tu turno.','bad'); render(); return; }
  if(S.ap<1){ notify('⚡','Necesitas 1 PA para lanzar el Ataque del Gran Odilio.','bad'); render(); return; }
  if(!odilioTargets().length){ notify('🚫','No hay territorios enemigos vecinos para atacar.','bad'); render(); return; }
  ODMODE.active=true; ODMODE.picks=[]; selectedFrom=null; inspectId=null; pendingModal=null; render();
}
function toggleOdilioPick(id){
  const valid = odilioTargets().map(v=>v.tg.id);
  if(!valid.includes(id)){ notify('🚫','Elige un territorio enemigo que colinde con tus tierras.','bad'); render(); return; }
  const i=ODMODE.picks.indexOf(id);
  if(i>=0) ODMODE.picks.splice(i,1); else if(ODMODE.picks.length<2) ODMODE.picks.push(id); else { ODMODE.picks.shift(); ODMODE.picks.push(id); }
  sfx('tap'); render();
}
function launchOdilio(){
  const a=ODMODE.picks[0], b=ODMODE.picks[1];
  ODMODE.active=false; ODMODE.picks=[];
  odilioStrike(a, b||-1);
  render();
}
function renderOdilioPanel(){
  const def = ODILIO[S.player.cls]||ODILIO.guerrero;

    </div>`);
  panel.querySelector('.ctx-close').addEventListener('click', ()=>{ ODMODE.active=false; ODMODE.picks=[]; render(); });
  const chips = panel.querySelector('.chip-row');
  valid.forEach(v=>{
    const f = S.modFog && isEnemyOf('player', v.tg.owner);
    const b = el(`<button class="chip ${ODMODE.picks.includes(v.tg.id)?'tab-active':''}"><span class="ctx-dot" style="background:${colorOf(v.tg.owner)}"></span>${v.tg.name} <small>${f?'?':v.tg.troops}</small></button>`);

function renderContextPanel(){
  if(ODMODE.active && odilioCharge()) return renderOdilioPanel();
  if(ODMODE.active) { ODMODE.active=false; ODMODE.picks=[]; }
  const panel = el(`<div class="ctx-panel"></div>`);

  if(!own && !other){
    panel.classList.add('ctx-empty');
    panel.innerHTML = `<span>👆 Toca una tierra del mapa para ver sus acciones</span>`;
    return panel;
  }
  const t = own || other;

    <div class="ctx-head">
      ${factionCrestHTML(t.owner, 24) || `<span class="ctx-dot" style="background:${colorOf(t.owner)}"></span>`}

  panel.appendChild(el(`<div class="ctx-info">${t.castle?`🏰 <b>Castillo de ${nameOf(t.owner)}</b> (+${castleBonus(t)} defensa · si cae, ese reino queda fuera) · `:''}🏞️ ${t.biome.passiveLabel}${t.isBoss?' · Jefe final':''} · Poder ${fogged?'?':territoryPower(t).toFixed(1)}${landGold?` · 💰 aporta +${landGold} oro/turno`:''}</div>`));

  if(own){
    const targets = neighbors(own.id).map(byId).filter(n=>isEnemyOf('player', n.owner));
    const atkRow = el(`<div class="ctx-section"><div class="ctx-label">⚔️ Atacar desde aquí ${S.ap<=0?'<em>(sin PA)</em>':(unitsOf(own)<minAttackTroops()?`<em>(necesitas ${minAttackTroops()} unidades)</em>`:'')}</div><div class="chip-row"></div></div>`);

      const f = S.modFog && isEnemyOf('player', n.owner);
      const b = el(`<button class="chip" ${S.ap<=0||unitsOf(own)<minAttackTroops()?'disabled':''}><span class="ctx-dot" style="background:${colorOf(n.owner)}"></span>${n.name} <small>${f?'?':n.troops}</small></button>`);
      b.addEventListener('click', ()=>{
        if(S.ap<=0){ notify('⚡','No te quedan Puntos de Acción este turno.','bad'); render(); return; }
        openAttackChoice(own.id, n.id);
      });
      chips.appendChild(b);
    });
    panel.appendChild(atkRow);

    const perTroop = recruitCost(own);
    const rate = (S.player.cls==='picaro' ? 4 : 3) + (S.player.bonusTradeRate||0);
    const grid = el(`<div class="ctx-grid"></div>`);
    const mk = (label, sub, disabled, fn, cls)=>{ const b=el(`<button class="${cls||''}" ${disabled?'disabled':''}><span>${label}</span><small>${sub}</small></button>`); b.addEventListener('click', fn); grid.appendChild(b); };

}

  const locked = !!(S.mp && !mpIsMyTurn());
